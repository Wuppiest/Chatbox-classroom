  <style>
/* ==========================================================
   Design-Tokens & Grundstile – warmes Creme & Grau
   ========================================================== */
:root {
  color-scheme: light;

  /* Flächen */
  --bg: #f3eee5;
  --bg-raised: #ebe5d9;
  --card: #fbf9f4;
  --surface: rgba(59, 52, 43, .035);
  --surface-2: rgba(59, 52, 43, .06);
  --surface-3: rgba(59, 52, 43, .1);
  --inset: #f1ece2;
  --border: #e3dbcc;
  --border-strong: #d4cab8;

  /* Text */
  --text: #2d2a26;
  --text-2: #6b655c;
  --text-3: #9b948a;

  /* Gedämpfte Akzente (Namen bleiben für den bestehenden Code gleich) */
  --violet: #7d7468;
  --cyan: #6b8591;
  --pink: #b07a6e;
  --green: #6f8f7a;
  --amber: #b8904a;
  --red: #b9533f;
  --accent: #3b3833;
  --on-accent: #fbf9f4;
  --grad: #3b3833;
  --grad-soft: rgba(59, 56, 51, .07);
  --amber-text: #8a6a33;
  --glass: rgba(251, 249, 244, .92);
  --glow-a: rgba(255, 255, 255, .55);
  --glow-b: rgba(214, 202, 182, .35);

  /* Eintragsarten */
  --t-hw: #6f8f7a;
  --t-test: #b8904a;
  --t-exam: #b06a55;
  --t-other: #737d8c;

  /* Form */
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 26px;

const pad = n => String(n).padStart(2, '0');

/** Gleiche Namen bekommen immer dieselbe Farbe (für Fächer und Personen) */

/** Liest ein Bild ein und verkleinert es. GIFs bleiben unverändert, damit sie animiert bleiben. */
function readImage(file, maxSize = 1400, quality = 0.82) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith('image/')) return reject(new Error('Bitte eine Bilddatei auswählen.'));
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Die Datei konnte nicht gelesen werden.'));
    reader.onload = () => {
      if (file.type === 'image/gif') {
        if (file.size > 4 * 1024 * 1024) return reject(new Error('Das GIF ist zu groß (max. 4 MB).'));
        return resolve(reader.result);
      }
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, maxSize / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);

        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Das Bild konnte nicht geladen werden.'));

    };

  });

'use strict';
/* ==========================================================
   UI-Bausteine: Toasts, Dialoge, Countdown, Fortschrittsring
   ========================================================== */
const UI = {
  toast(text, type = 'ok') {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML = icon(type === 'err' ? 'alert' : type === 'info' ? 'info' : 'check') + `<span>${esc(text)}</span>`;
    $('#toasts').appendChild(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 2600);
  },

  /** Öffnet einen Dialog. `build(dialog)` kann Ereignisse anhängen; Rückgabe-Promise endet beim Schließen. */
  modal({ title, body, foot = '', cls = '', onOpen }) {
    const dlg = document.createElement('dialog');
    dlg.className = 'modal ' + cls;
    dlg.innerHTML = title != null
      ? `<div class="modal-head"><h3>${title}</h3><button class="btn ghost icon sm" data-close aria-label="Schließen">${icon('x')}</button></div>
         <div class="modal-body">${body}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ''}`
      : body;
    document.body.appendChild(dlg);
    return new Promise(resolve => {
      dlg.addEventListener('close', () => { resolve(dlg.returnValue); dlg.remove(); });
      dlg.addEventListener('click', e => {
        if (e.target === dlg || e.target.closest('[data-close]')) dlg.close('');
      });
      dlg.showModal();
      onOpen?.(dlg);
    });
  },

  async confirm(text, { ok = 'Bestätigen', danger = false } = {}) {
    const r = await UI.modal({
      title: 'Bist du sicher?',
      body: `<p class="muted">${esc(text)}</p>`,
      foot: `<button class="btn ghost" data-close>Abbrechen</button><button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${esc(ok)}</button>`,
      onOpen: d => $('[data-ok]', d).onclick = () => d.close('ok'),
    });
    return r === 'ok';
  },

  showImage(src) {
    UI.modal({ body: `<img src="${esc(src)}" alt="">`, cls: 'image', onOpen: d => d.onclick = () => d.close() });
  },

  /** Countdown, der sich jede Sekunde selbst aktualisiert (siehe UI.tick) */
  countdown(target, big = false) {
    return `<div class="countdown ${big ? 'big' : ''}" data-cd="${+target}">${UI.cdUnits(target - Date.now())}</div>`;
  },
  cdUnits(ms) {
    const p = durParts(ms);
    return [[p.d, 'Tage'], [pad(p.h), 'Std'], [pad(p.m), 'Min'], [pad(p.s), 'Sek']]
      .map(([v, l]) => `<div class="unit"><b>${v}</b><small>${l}</small></div>`).join('');
  },

  ring(pct, center, size = 120, stroke = 9) {
    const r = (size - stroke) / 2, c = 2 * Math.PI * r;
    return `<div class="ring" style="--size:${size}px">
      <svg viewBox="0 0 ${size} ${size}"><circle class="track" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}"/>
      <circle class="val" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - clamp(pct, 0, 1))}"/></svg>
      <div class="center">${center}</div></div>`;
  },

  empty(iconName, title, text = '') {
    return `<div class="empty"><div class="icon-wrap">${icon(iconName, 'i-lg')}</div><b>${title}</b>${text ? `<span>${text}</span>` : ''}</div>`;
  },

  avatar(name, cls = '') {
    return `<div class="avatar ${cls}" style="--h:${hueOf(name)}">${esc(initials(name))}</div>`;
  },

  /** Aktualisiert alle Countdowns auf der Seite */
  tick() {
    const now = Date.now();
    for (const el of $$('[data-cd]')) el.innerHTML = UI.cdUnits(+el.dataset.cd - now);
    for (const el of $$('[data-rel]')) el.textContent = durText(+el.dataset.rel - now);
  },
};

// Farbverlauf für Fortschrittsringe (einmal global definiert)
document.body.insertAdjacentHTML('afterbegin',
  '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b3833"/><stop offset="1" stop-color="#8f8576"/></linearGradient></defs></svg>');

</script>

};

  { id: 'seed-bio-test-2026-11-02', type: 'test', subject: 'Biologie', title: 'Bio-Test', date: '2026-11-02', time: '08:00' },

};

/** Angemeldete Person – wird von Auth gesetzt */
const ME = { uid: '', name: '' };

const Store = {
  online: false,

  async init() {
    if (location.protocol.startsWith('http')) {
      try {
        const ctl = new AbortController();
        setTimeout(() => ctl.abort(), 2500);
        const r = await fetch('api/ping', { signal: ctl.signal });
        this.online = r.ok && (await r.json()).ok === true;
      } catch { this.online = false; }
    }
    if (this.online) {
      const es = new EventSource('api/stream?uid=' + encodeURIComponent(ME.uid));
      for (const ev of ['message', 'users', 'events', 'config', 'scores'])
        es.addEventListener(ev, e => Bus.emit('server:' + ev, JSON.parse(e.data)));
    }
  },

  async api(method, path, body) {
    const r = await fetch('api/' + path, {
      method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Serverfehler ' + r.status);

/* ---------- Einstellungen & Kalender ---------- */
const Data = {
  cfg: structuredClone(DEFAULT_CONFIG),
  events: [],
  done: new Set(LS.get('doneEvents', [])),

  normalize(c) {
    const cfg = Object.assign(structuredClone(DEFAULT_CONFIG), c || {});
    if (c) delete cfg.sample;
    return cfg;
  },

  async load() {
    if (Store.online) {
      try {
        this.cfg = this.normalize(await Store.api('GET', 'config'));
        this.events = await Store.api('GET', 'events');
      } catch (e) { console.warn(e); }
      Bus.on('server:events', list => { this.events = list; Bus.emit('data'); });
      Bus.on('server:config', c => { this.cfg = this.normalize(c); Bus.emit('data'); });
    } else {
      this.cfg = this.normalize(LS.get('config', null));
      this.events = LS.get('events', []);
      const seeded = new Set(LS.get('seededEvents', []));
      const fresh = DEFAULT_EVENTS.filter(e => !seeded.has(e.id));
      if (fresh.length) {
        this.events = this.events.filter(e => !fresh.some(f => f.id === e.id)).concat(fresh.map(e => ({ ...e, created: Date.now() })));
        LS.set('events', this.events);
        LS.set('seededEvents', [...seeded, ...fresh.map(e => e.id)]);
      }

    const clean = structuredClone(c);
    delete clean.sample;
    if (Store.online) await Store.api('PUT', 'config', clean);

  },

  async saveEvent(ev) {

    } else {
      const item = { ...ev, id: ev.id || uid(), created: ev.created || Date.now() };
      this.events = this.events.filter(e => e.id !== item.id).concat(item);
      LS.set('events', this.events);
    }
    Bus.emit('data');
  },

  async deleteEvent(id) {
    if (Store.online) await Store.api('DELETE', 'events/' + id);
    this.events = this.events.filter(e => e.id !== id);
    if (!Store.online) LS.set('events', this.events);
    Bus.emit('data');
  },

  toggleDone(id) {
    this.done.has(id) ? this.done.delete(id) : this.done.add(id);
    LS.set('doneEvents', [...this.done]);
    Bus.emit('data');
  },

  eventDate: e => at(parseDate(e.date), e.time || '00:00'),
  sorted() { return [...this.events].sort((a, b) => this.eventDate(a) - this.eventDate(b)); },
  upcoming(now = new Date(), includeDone = false) {
    return this.sorted().filter(e => this.eventDate(e) >= now && (includeDone || !this.done.has(e.id)));
  },
  subjects() {
    const set = new Set();
    for (const w of ['A', 'B']) for (const day of Object.values(this.cfg.schedule[w] || {})) day.forEach(s => s && set.add(s.split('·')[0].trim()));
    return [...set].sort((a, b) => a.localeCompare(b, 'de'));
  },
};

    0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208,
    0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
  ];
  const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  const bytes = new TextEncoder().encode(text);
  const len = ((bytes.length + 9 + 63) >> 6) << 6;
  const data = new Uint8Array(len);
  data.set(bytes); data[bytes.length] = 0x80;
  const view = new DataView(data.buffer);
  view.setUint32(len - 4, bytes.length * 8);
  view.setUint32(len - 8, Math.floor(bytes.length / 0x20000000));

  for (let off = 0; off < len; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = view.getUint32(off + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rot(w[i - 15], 7) ^ rot(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = rot(w[i - 2], 17) ^ rot(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rot(e, 6) ^ rot(e, 11) ^ rot(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((rot(a, 2) ^ rot(a, 13) ^ rot(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

        if (!a) {

        LS.set('session', { id: a.id });

        resolve(a);

  },
};

  <script>/* js/core/schedule.js */
'use strict';
/* ==========================================================
   Stundenplan-Logik: A/B-Woche, Blöcke, Ferien, Schuljahr
   ========================================================== */
const Schedule = {
  holidays() {
    return Data.cfg.holidays.filter(h => h.start && h.end).sort((a, b) => a.start.localeCompare(b.start));
  },
  holidayOn(day) {
    const s = ymd(day);
    return this.holidays().find(h => h.start <= s && s <= h.end) || null;
  },
  isSchoolDay(day) {
    const w = day.getDay();
    return w > 0 && w < 6 && !this.holidayOn(day);
  },

  weekType(day) {
    const ref = mondayOf(parseDate(Data.cfg.aWeekRef || '2026-11-02'));
    const weeks = Math.round((mondayOf(day) - ref) / (7 * 864e5));
    return ((weeks % 2) + 2) % 2 === 0 ? 'A' : 'B';
  },
  /** Woche, um die es gerade geht – am Wochenende schon die nächste */
  focusMonday(now = new Date()) {
    const w = now.getDay();
    return w === 0 || w === 6 ? addDays(mondayOf(now), 7) : mondayOf(now);
  },

  subjectAt(week, dow, i) {
    return (((Data.cfg.schedule[week] || {})[dow] || [])[i] || '').trim();
  },
  /** Alle Blöcke eines Tages (auch freie), mit Start/Ende als Datum */
  slots(day) {
    const week = this.weekType(day), dow = day.getDay();
    return Data.cfg.blocks.map((b, i) => {
      const raw = this.subjectAt(week, dow, i);
      // 'Fach · Raum · Lehrkraft' – ein Teil mit Ziffer ist der Raum, sonst die Lehrkraft (z. B. 'Klassenrat · RudT')
      const [subject = '', ...rest] = raw.split('·').map(s => s.trim()).filter(Boolean);
      const room = rest.find(x => /\d/.test(x)) || '', teacher = rest.find(x => x !== room) || '';
      return { i, week, raw, subject, room, teacher, start: at(day, b.start), end: at(day, b.end) };
    });
  },
  lessons(day) {
    return this.isSchoolDay(day) ? this.slots(day).filter(l => l.subject) : [];
  },

  /** Laufender und nächster Block */
  status(now = new Date()) {
    let cur = null, next = null;
    for (let k = 0; k < 60 && !next; k++) {
      for (const l of this.lessons(addDays(startOfDay(now), k))) {
        if (l.start <= now && now < l.end) cur = l;
        else if (l.start > now) { next = l; break; }
      }
    }
    return { cur, next };
  },
  /** Heute (falls noch Unterricht kommt) oder der nächste Schultag */
  focusDay(now = new Date()) {
    for (let k = 0; k < 60; k++) {
      const d = addDays(startOfDay(now), k);
      const ls = this.lessons(d);
      if (ls.length && (k > 0 || ls[ls.length - 1].end > now)) return { day: d, lessons: ls };
    }
    return { day: startOfDay(now), lessons: [] };
  },

  holidayStatus(now = new Date()) {
    const today = ymd(now), list = this.holidays();
    return {
      current: list.find(h => h.start <= today && today <= h.end) || null,
      next: list.find(h => h.start > today) || null,
    };
  },

  schoolDaysBetween(from, to) {
    let n = 0;
    for (let d = addDays(startOfDay(from), 1); d < to; d = addDays(d, 1)) if (this.isSchoolDay(d)) n++;
    return n;
  },

  /** Fortschritt bis zur nächsten Klassenstufe (Ende = Beginn der Sommerferien) */
  yearProgress(now = new Date()) {
    const today = ymd(now), list = this.holidays();
    const summer = list.find(h => /sommer/i.test(h.name) && h.start > today);
    if (!summer) return null;
    const end = parseDate(summer.start);
    const prev = [...list].reverse().find(h => /sommer/i.test(h.name) && h.end < today);
    const start = prev ? addDays(parseDate(prev.end), 1) : new Date(end.getFullYear() - 1, 7, 15);
    return {
      summer, end,
      pct: clamp((now - start) / (end - start), 0, 1),
      schoolDays: this.schoolDaysBetween(now, end),
    };
  },
};

'use strict';
/* ==========================================================

const Pages = {};

Pages.home = {
  title: () => {
    const h = new Date().getHours();
    const greet = h < 5 ? 'Gute Nacht' : h < 11 ? 'Guten Morgen' : h < 18 ? 'Hallo' : 'Guten Abend';
    return `${greet}${ME.name ? ', ' + esc(ME.name) : ''}`;
  },
  subtitle: () => fmt.dateLong(new Date()),
  actions: () => {
    const now = new Date();
    const week = Schedule.weekType(Schedule.focusMonday(now));
    const hol = Schedule.holidayOn(now);
    return `${hol ? `<span class="chip cyan">${icon('palm', 'i-sm')} ${esc(hol.name)}</span>` : ''}
      <span class="chip violet">${now.getDay() % 6 === 0 ? 'Kommende Woche: ' : ''}${week}-Woche</span>`;
  },

  render(root) {
    const now = new Date();
    root.innerHTML = `
      ${Data.cfg.sample ? `<div class="notice" style="margin-bottom:16px">${icon('alert')}<div>Es sind noch <b>Beispieldaten</b> eingetragen. Trag unter <a href="#settings">Einstellungen</a> euren echten Blockplan und eure Ferien ein.</div></div>` : ''}
      <div class="bento">
        <section class="card glow pad-lg b-next next-event">${this.nextEvent(now)}</section>
        <section class="card pad-lg b-block">${this.nextBlock(now)}</section>
        <section class="card pad-lg b-holiday">${this.holiday(now)}</section>
        <section class="card pad-lg b-grade">${this.grade(now)}</section>
        <section class="card b-today">${this.today(now)}</section>
        <section class="card b-upcoming">${this.upcoming(now)}</section>
      </div>`;
  },

  nextEvent(now) {
    const e = Data.upcoming(now)[0];
    const head = `<div class="card-head"><span class="card-label">${icon('pin')} Nächster Termin</span><a class="link" href="#calendar">Kalender ${icon('right', 'i-sm')}</a></div>`;
    if (!e) return head + UI.empty('calendar', 'Nichts geplant', 'Trag Hausaufgaben, Tests oder Klassenarbeiten ein.') +
      `<div class="row" style="justify-content:center"><a class="btn primary" href="#calendar/new">${icon('plus')} Eintrag hinzufügen</a></div>`;
    const d = Data.eventDate(e), t = TYPES[e.type] || TYPES.other;
    return `${head}
      <div class="row wrap"><span class="chip type-chip type-${e.type}">${icon(t.icon, 'i-sm')} ${t.label}</span>${e.subject ? `<span class="chip">${esc(e.subject)}</span>` : ''}</div>
      <div class="title-xl">${esc(e.title)}</div>
      <div class="meta-row"><span>${icon('calendar', 'i-sm')} ${relDay(d)}, ${fmt.date(d)}</span><span>${icon('clock', 'i-sm')} ${fmt.time(d)} Uhr</span></div>
      ${UI.countdown(d)}`;
  },

  nextBlock(now) {
    const { cur, next } = Schedule.status(now);
    const head = `<div class="card-head"><span class="card-label">${icon('clock')} ${cur ? 'Gerade' : 'Nächster Block'}</span><a class="link" href="#blocks">Blockplan ${icon('right', 'i-sm')}</a></div>`;
    if (!cur && !next) return head + UI.empty('clock', 'Kein Unterricht gefunden', 'Trag euren Blockplan in den Einstellungen ein.');
    const main = cur || next;
    const pct = cur ? (now - cur.start) / (cur.end - cur.start) : 0;
    const center = cur
      ? `<b>${Math.round(pct * 100)}%</b><small>vorbei</small>`
      : `<b>${main.i + 1}</b><small>Block</small>`;
    let html = `${head}<div class="block-now">${UI.ring(cur ? pct : 0, center, 108, 8)}
      <div class="info">
        ${cur ? '<span class="chip green live"><span class="dot"></span>Läuft</span>' : `<span class="chip">${relDay(main.start)} · ${main.week}-Woche</span>`}
        <div class="title-xl">${esc(main.subject)}</div>
        <div class="meta">${fmt.time(main.start)} – ${fmt.time(main.end)}${main.room ? ' · ' + esc(main.room) : ''}${main.teacher ? ' · ' + esc(main.teacher) : ''}</div>
        <div class="meta" style="margin-top:4px">${cur ? 'noch' : 'in'} <b class="mono" data-rel="${+(cur ? cur.end : main.start)}">${durText((cur ? cur.end : main.start) - now)}</b></div>
      </div></div>`;
    if (cur && next) html += `<div class="after">${icon('arrowRight', 'i-sm')} Danach <b>${esc(next.subject)}</b> um ${fmt.time(next.start)}${sameDay(next.start, now) ? '' : ' (' + relDay(next.start) + ')'}</div>`;
    return html;
  },

  holiday(now) {
    const { current, next } = Schedule.holidayStatus(now);
    const head = `<div class="card-head"><span class="card-label">${icon('palm')} Ferien-Countdown</span></div>`;
    if (!next && !current) return head + UI.empty('sun', 'Keine Ferien eingetragen', 'Ergänze sie in den Einstellungen.');
    let html = head;
    if (current) html += `<div class="title-lg">Gerade sind ${esc(current.name)} 🎉</div><div class="meta" style="margin-bottom:18px">bis ${fmt.dateLong(parseDate(current.end))}</div>`;
    if (next) {
      const d = parseDate(next.start);
      html += `<div class="row wrap" style="margin-bottom:16px"><div style="flex:1;min-width:180px"><div class="title-lg">${esc(next.name)}</div>
        <div class="meta">${fmt.dateFull(d)} – ${fmt.dateFull(parseDate(next.end))}</div></div>
        <span class="chip cyan">noch ${Schedule.schoolDaysBetween(now, d)} Schultage</span></div>${UI.countdown(d, true)}`;
    }
    return html;
  },

  grade(now) {
    const head = `<div class="card-head"><span class="card-label">${icon('cap')} Nächste Klassenstufe</span></div>`;
    const p = Schedule.yearProgress(now);
    if (!p) return head + UI.empty('cap', 'Sommerferien fehlen', 'Trag sie in den Einstellungen ein.');
    const g = Number(Data.cfg.grade) || 0;
    return `${head}<div class="grade-wrap">${UI.ring(p.pct, `<b>${(p.pct * 100).toFixed(0)}%</b><small>geschafft</small>`, 124, 10)}
      <div><div class="title-lg">Klasse ${g} → <span class="grad-text">${g + 1}</span></div>
      <div class="meta">ab ${fmt.dateFull(p.end)}</div>
      <div class="meta-row" style="margin-top:12px"><span>${icon('calendar', 'i-sm')} <b class="mono" data-rel="${+p.end}">${durText(p.end - now)}</b></span><span>${icon('book', 'i-sm')} ${p.schoolDays} Schultage</span></div>
      </div></div>`;
  },

  today(now) {
    const { day, lessons } = Schedule.focusDay(now);
    const isToday = sameDay(day, now);
    const head = `<div class="card-head"><span class="card-label">${icon('layers')} ${isToday ? 'Heute' : relDay(day) + ', ' + DOW_LONG[day.getDay()]}</span><span class="chip" style="margin-left:auto">${Schedule.weekType(day)}-Woche</span></div>`;
    if (!lessons.length) return head + UI.empty('sun', 'Kein Unterricht');
    return head + `<div class="timeline">${lessons.map(l => {
      const st = l.end <= now ? 'done' : l.start <= now ? 'now' : '';
      return `<div class="tl-item ${st}" style="--h:${hueOf(l.subject)}"><span class="time">${fmt.time(l.start)}<br>${fmt.time(l.end)}</span>
        <span class="subj"><i></i>${esc(l.subject)}</span><span class="faint" style="font-size:12px">${l.room ? esc(l.room) : 'Block ' + (l.i + 1)}</span></div>`;
    }).join('')}</div>`;
  },

  upcoming(now) {
    const list = Data.upcoming(now).slice(1, 6);
    const head = `<div class="card-head"><span class="card-label">${icon('calendar')} Danach steht an</span><a class="link" href="#calendar/new">${icon('plus', 'i-sm')} Neu</a></div>`;
    if (!list.length) return head + UI.empty('check', 'Sonst ist nichts geplant');
    return head + `<div class="list">${list.map(e => Pages.calendar.itemHTML(e, now)).join('')}</div>`;
  },
};

'use strict';
/* ==========================================================
   Kalender: Hausaufgaben, Tests, Klassenarbeiten, Termine
   ========================================================== */
Pages.calendar = {
  month: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
  selected: null,
  filter: 'all',

  title: () => 'Kalender',
  subtitle: () => {
    const n = Data.upcoming().length;
    return n ? `${n} anstehende${n === 1 ? 'r Eintrag' : ' Einträge'}` : 'Keine anstehenden Einträge';
  },
  actions: () => `<button class="btn primary" data-new-event>${icon('plus')} <span>Neuer Eintrag</span></button>`,

  render(root, arg) {
    const m = this.month, y = m.getFullYear(), mo = m.getMonth();
    const first = mondayOf(new Date(y, mo, 1));
    const today = ymd(new Date());
    const byDay = {};
    for (const e of Data.sorted()) if (this.filter === 'all' || e.type === this.filter) (byDay[e.date] ||= []).push(e);

    let cells = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(d => `<div class="dow">${d}</div>`).join('');
    for (let i = 0; i < 42; i++) {
      const d = addDays(first, i), s = ymd(d), evs = byDay[s] || [];
      const hol = Schedule.holidayOn(d);
      const cls = ['day', d.getMonth() !== mo && 'out', s === today && 'today', s === this.selected && 'sel',
        (d.getDay() % 6 === 0) && 'weekend', hol && 'holiday'].filter(Boolean).join(' ');
      cells += `<button class="${cls}" data-day="${s}" title="${hol ? esc(hol.name) : ''}"><span class="num">${d.getDate()}</span>
        <span class="evs">${evs.slice(0, 3).map(e => `<span class="ev type-${e.type}">${esc(e.subject || TYPES[e.type].label)}</span>`).join('')}</span>
        ${evs.length > 3 ? `<span class="more">+${evs.length - 3} weitere</span>` : ''}</button>`;
    }

    const filters = [['all', 'Alle'], ...Object.entries(TYPES).map(([k, t]) => [k, t.label])];
    root.innerHTML = `
      <div class="toolbar">
        <button class="btn icon" data-nav="-1" aria-label="Vorheriger Monat">${icon('left')}</button>
        <button class="btn icon" data-nav="1" aria-label="Nächster Monat">${icon('right')}</button>
        <span class="month">${fmt.month(m)}</span>
        <button class="btn sm ghost" data-nav="0">Heute</button>
        <div class="spacer"></div>
        <div class="row wrap">${filters.map(([k, l]) => `<button class="chip chip-btn ${this.filter === k ? 'active' : ''}" data-filter="${k}">${l}</button>`).join('')}</div>
      </div>
      <div class="cal-layout">
        <section class="card">
          <div class="month-grid">${cells}</div>
          <div class="legend">${Object.entries(TYPES).map(([k, t]) => `<span class="type-${k}"><i></i>${t.label}</span>`).join('')}</div>
        </section>
        <section class="card">${this.agenda()}</section>
      </div>`;

    root.onclick = e => {
      const t = e.target.closest('[data-nav],[data-filter],[data-day],[data-clear]');
      if (!t) return;
      if (t.dataset.nav != null) {
        const n = +t.dataset.nav;
        this.month = n === 0 ? new Date(new Date().getFullYear(), new Date().getMonth(), 1) : new Date(y, mo + n, 1);
        if (n === 0) this.selected = null;
      } else if (t.dataset.filter) this.filter = t.dataset.filter;
      else if (t.dataset.clear != null) this.selected = null;
      else if (t.dataset.day) {
        if (this.selected === t.dataset.day && e.detail > 1) return this.openEditor({ date: t.dataset.day });
        this.selected = this.selected === t.dataset.day ? null : t.dataset.day;
      }
      this.render(root);
    };
    if (arg === 'new') { history.replaceState(null, '', '#calendar'); this.openEditor(); }
  },

  agenda() {
    const now = new Date();
    let list, title, sub;
    if (this.selected) {
      const d = parseDate(this.selected);
      list = Data.sorted().filter(e => e.date === this.selected);
      title = fmt.dateLong(d);
      const hol = Schedule.holidayOn(d);
      sub = hol ? hol.name : Schedule.isSchoolDay(d) ? `${Schedule.weekType(d)}-Woche · ${Schedule.lessons(d).length} Blöcke` : 'Wochenende';
    } else {
      list = Data.upcoming(now, true);
      title = 'Anstehend';
      sub = 'Alle kommenden Einträge';
    }
    if (this.filter !== 'all') list = list.filter(e => e.type === this.filter);
    return `<div class="agenda-head"><div style="flex:1"><div class="title-lg">${title}</div><div class="meta">${esc(sub)}</div></div>
        ${this.selected ? `<button class="btn icon sm ghost" data-clear title="Auswahl aufheben">${icon('x')}</button>` : ''}
        <button class="btn icon sm" data-new-event="${this.selected || ''}" title="Neuer Eintrag">${icon('plus')}</button></div>
      ${list.length ? `<div class="list">${list.map(e => this.itemHTML(e, now)).join('')}</div>` : UI.empty('calendar', 'Keine Einträge', this.selected ? 'Doppelklick auf einen Tag legt einen Eintrag an.' : '')}`;
  },

  itemHTML(e, now = new Date()) {
    const d = Data.eventDate(e), t = TYPES[e.type] || TYPES.other, done = Data.done.has(e.id);
    return `<div class="item clickable type-${e.type} ${done ? 'done' : ''} ${d < now ? 'past' : ''}" data-event="${esc(e.id)}">
      <span class="accent"></span>
      <div class="date-tile"><small>${DOW_SHORT[d.getDay()]}</small><b>${d.getDate()}</b><small>${fmt.monthShort(d)}</small></div>
      <div class="body"><div class="title">${esc(e.title)}</div><div class="sub">${t.label}${e.subject ? ' · ' + esc(e.subject) : ''} · ${fmt.time(d)} Uhr</div></div>
      <div class="side"><b>${relDay(d)}</b></div>
      ${e.type === 'hw' ? `<button class="done-toggle ${done ? 'on' : ''}" data-done="${esc(e.id)}" title="${done ? 'Als offen markieren' : 'Als erledigt markieren'}">${icon('check', 'i-sm')}</button>` : ''}
    </div>`;
  },

  async openEditor(ev = {}) {
    const isNew = !ev.id;
    const e = { type: 'hw', subject: '', title: '', date: ymd(addDays(new Date(), 1)), time: '08:00', ...ev };
    const subjects = Data.subjects();
    const res = await UI.modal({
      title: isNew ? 'Neuer Eintrag' : 'Eintrag bearbeiten',
      body: `<form class="form-grid" id="evForm">
        <div class="type-picker">${Object.entries(TYPES).map(([k, t]) => `<label class="type-${k}"><input type="radio" name="type" value="${k}" ${e.type === k ? 'checked' : ''}><span>${icon(t.icon)}${t.label}</span></label>`).join('')}</div>
        <label class="field"><span>Beschreibung</span><input class="input" name="title" required maxlength="300" placeholder="z. B. S. 42 Nr. 3a–c" value="${esc(e.title)}"></label>
        <label class="field"><span>Fach</span><input class="input" name="subject" list="subjList" maxlength="40" placeholder="z. B. Mathe" value="${esc(e.subject)}">
          <datalist id="subjList">${subjects.map(s => `<option value="${esc(s)}">`).join('')}</datalist></label>
        <div class="form-grid cols-2">
          <label class="field"><span>Datum</span><input class="input" type="date" name="date" required value="${esc(e.date)}"></label>
          <label class="field"><span>Uhrzeit</span><input class="input" type="time" name="time" required value="${esc(e.time)}"></label>
        </div>
      </form>`,
      foot: `${isNew ? '' : `<button class="btn danger left" data-del>${icon('trash')} Löschen</button>`}
        <button class="btn ghost" data-close>Abbrechen</button><button class="btn primary" data-save>${icon('check')} Speichern</button>`,
      onOpen: dlg => {
        const f = $('#evForm', dlg);
        setTimeout(() => f.title.focus(), 50);
        const save = async () => {
          if (!f.reportValidity()) return;
          const data = { ...ev, type: f.type.value, title: f.title.value.trim(), subject: f.subject.value.trim(), date: f.date.value, time: f.time.value, author: ev.author || ME.name };
          try { await Data.saveEvent(data); dlg.close('saved'); } catch (err) { UI.toast(err.message, 'err'); }
        };
        $('[data-save]', dlg).onclick = save;
        f.onsubmit = x => { x.preventDefault(); save(); };
        const del = $('[data-del]', dlg);
        if (del) del.onclick = async () => {
          try { await Data.deleteEvent(ev.id); dlg.close('deleted'); } catch (err) { UI.toast(err.message, 'err'); }
        };
      },
    });
    if (res === 'saved') UI.toast(isNew ? 'Eintrag gespeichert' : 'Änderungen gespeichert');
    if (res === 'deleted') UI.toast('Eintrag gelöscht');
  },
};

// Einträge sind überall anklickbar (Übersicht und Kalender)
document.addEventListener('click', e => {
  const done = e.target.closest('[data-done]');
  if (done) { e.stopPropagation(); Data.toggleDone(done.dataset.done); return; }
  const neu = e.target.closest('[data-new-event]');
  if (neu) { Pages.calendar.openEditor(neu.dataset.newEvent ? { date: neu.dataset.newEvent } : {}); return; }
  const item = e.target.closest('[data-event]');
  if (item) { const ev = Data.events.find(x => x.id === item.dataset.event); if (ev) Pages.calendar.openEditor(ev); }
});

  <script>/* js/pages/blocks.js */
'use strict';
/* ==========================================================
   Blockplan (A/B-Woche)
   ========================================================== */
Pages.blocks = {
  week: null, // angezeigte Woche: 0 = aktuelle/kommende, 1 = die danach

  title: () => 'Blockplan',
  subtitle: () => {
    const mon = Schedule.focusMonday();
    return `${Schedule.weekType(mon)}-Woche · ${fmt.dateFull(mon)} – ${fmt.dateFull(addDays(mon, 4))}`;
  },
  actions() {
    const mon = Schedule.focusMonday();
    return `<div class="seg" id="weekSeg">
      <button data-w="0" class="${this.week !== 1 ? 'active' : ''}">${Schedule.weekType(mon)}-Woche</button>
      <button data-w="1" class="${this.week === 1 ? 'active' : ''}">${Schedule.weekType(addDays(mon, 7))}-Woche</button></div>`;
  },

  render(root) {
    const now = new Date();
    const monday = addDays(Schedule.focusMonday(now), this.week === 1 ? 7 : 0);
    const { cur, next } = Schedule.status(now);
    const key = l => l && `${ymd(l.start)}-${l.i}`;
    const lessonsThisWeek = [0, 1, 2, 3, 4].reduce((n, k) => n + Schedule.lessons(addDays(monday, k)).length, 0);
    const p = Schedule.yearProgress(now);

    let grid = '<div></div>';
    for (let k = 0; k < 5; k++) {
      const d = addDays(monday, k), hol = Schedule.holidayOn(d);
      grid += `<div class="hd ${sameDay(d, now) ? 'today' : ''}">${DOW_SHORT[d.getDay()]} · ${d.getDate()}.${d.getMonth() + 1}.<b>${hol ? esc(hol.name) : DOW_LONG[d.getDay()]}</b></div>`;
    }
    Data.cfg.blocks.forEach((b, i) => {
      grid += `<div class="time"><b>Block ${i + 1}</b>${b.start}<br>${b.end}</div>`;
      for (let k = 0; k < 5; k++) {
        const d = addDays(monday, k);
        const slot = Schedule.slots(d)[i];
        const off = !!Schedule.holidayOn(d);
        const id = `${ymd(d)}-${i}`;
        if (!slot.subject) { grid += `<div class="lesson free ${off ? 'off' : ''}"><b>Frei</b></div>`; continue; }
        const st = key(cur) === id ? 'is-now' : key(next) === id ? 'is-next' : '';
        grid += `<div class="lesson ${st} ${sameDay(d, now) ? 'is-today' : ''} ${off ? 'off' : ''}" style="--h:${hueOf(slot.subject)}">
          ${st === 'is-now' ? '<span class="chip green tag live"><span class="dot"></span>Jetzt</span>' : st === 'is-next' ? '<span class="chip violet tag">Als Nächstes</span>' : ''}
          <b>${esc(slot.subject)}</b><small>${[slot.room, slot.teacher].filter(Boolean).map(esc).join(' · ') || b.start + '–' + b.end}</small></div>`;
      }
    });

    const main = cur || next;
    root.innerHTML = `
      <div class="stat-row">
        <div class="card stat"><div class="card-label">${icon('clock')} ${cur ? 'Läuft gerade' : 'Nächster Block'}</div>
          <div class="val">${main ? esc(main.subject) : '–'}</div>
          <div class="meta">${main ? `${cur ? 'noch' : relDay(main.start) + ', in'} <span class="mono" data-rel="${+(cur ? cur.end : main.start)}">${durText((cur ? cur.end : main.start) - now)}</span>` : 'Kein Block geplant'}</div></div>
        <div class="card stat"><div class="card-label">${icon('layers')} Diese Woche</div><div class="val">${lessonsThisWeek} Blöcke</div>
          <div class="meta">${Schedule.weekType(monday)}-Woche · danach ${Schedule.weekType(addDays(monday, 7))}-Woche</div></div>
        <div class="card stat"><div class="card-label">${icon('cap')} Schuljahr</div><div class="val">${p ? Math.round(p.pct * 100) + ' %' : '–'}</div>
          <div class="bar" style="margin-top:12px"><div style="width:${p ? p.pct * 100 : 0}%"></div></div></div>
      </div>
      <section class="card"><div class="scroll-x"><div class="week-grid">${grid}</div></div></section>
      ${Data.cfg.sample ? `<div class="notice" style="margin-top:16px">${icon('alert')}<div>Das ist ein <b>Beispielplan</b>. Trag euren echten Plan unter <a href="#settings/plan">Einstellungen → Blockplan</a> ein.</div></div>` : ''}`;
  },

  onTopbar(bar) {
    const seg = $('#weekSeg', bar);
    if (seg) seg.onclick = e => { const b = e.target.closest('[data-w]'); if (b) { this.week = +b.dataset.w; App.refresh(); } };
  },
};

  <script>/* js/pages/chat.js */
'use strict';
/* ==========================================================
   Chat: Klassenchat + private Einzelchats, Fotos, GIFs, Sticker
   ========================================================== */
const Chat = {
  STICKERS: ['😂', '🤣', '🥳', '😎', '🤯', '😭', '🥺', '😡', '🤡', '💀', '👀', '🤓', '😴', '🤔', '🙄', '😇', '🫠', '🥶',
    '👍', '👎', '🙏', '👏', '💪', '🫶', '❤️', '🔥', '💯', '🎉', '✨', '⭐', '🌈', '☕', '🍕', '🍟', '🍩', '🧋',
    '⚽', '🏀', '🎮', '🎧', '📚', '✏️', '📝', '🧮', '🏆', '🚀', '🐶', '🐱', '🦄', '🐸', '🐧', '🦖', '👻', '🤖'],
  room: 'global',
  msgs: {},
  unread: {},
  users: {},
  started: false,
  root: null,
  bc: null,

  dmRoom(other) { return 'dm:' + [ME.uid, other].sort().join(':'); },
  otherOf(room) { return room.split(':').slice(1).find(u => u !== ME.uid); },
  roomName(room) { return room === 'global' ? 'Klassenchat' : this.users[this.otherOf(room)]?.name || 'Unbekannt'; },
  totalUnread() { return Object.values(this.unread).reduce((a, b) => a + b, 0); },

  /* ---------- Start (einmalig, läuft auch im Hintergrund) ---------- */
  async start() {
    if (this.started) return;
    this.started = true;
    for (const a of ACCOUNTS) this.users[a.id] = { uid: a.id, name: a.name };
    if (Store.online) {
      Bus.on('server:message', m => this.receive(m));
      Bus.on('server:users', u => { this.users = { ...this.users, ...u }; this.renderSide(); this.renderHead(); });
      try {
        if (ME.name) await Store.api('POST', 'users', { uid: ME.uid, name: ME.name });
        this.users = { ...this.users, ...await Store.api('GET', 'users') };
      } catch (e) { console.warn(e); }
    } else {
      for (const m of LS.get('chatLocal', [])) (this.msgs[m.room] ||= []).push(m);
      if ('BroadcastChannel' in window) {
        this.bc = new BroadcastChannel('plyon-chat');
        this.bc.onmessage = e => this.receive(e.data);
      }
    }
    await this.load('global');
  },

  async load(room) {
    if (!Store.online || this.msgs[room]?.loaded) { this.msgs[room] ||= []; return; }
    try {
      const list = await Store.api('GET', `messages?room=${encodeURIComponent(room)}&uid=${encodeURIComponent(ME.uid)}`);
      const known = this.msgs[room] || [];
      this.msgs[room] = [...list, ...known.filter(k => !list.some(x => x.id === k.id))].sort((a, b) => a.ts - b.ts);
      this.msgs[room].loaded = true;
    } catch (e) { console.warn(e); this.msgs[room] ||= []; }
  },

  visible() { return !!this.root?.isConnected && !document.hidden; },

  receive(m) {
    if (m.room !== 'global' && !m.room.split(':').includes(ME.uid)) return;
    const list = this.msgs[m.room] ||= [];
    if (list.some(x => x.id === m.id)) return;
    list.push(m);
    if (m.uid !== ME.uid && !this.users[m.uid]) this.users[m.uid] = { uid: m.uid, name: m.name, online: true };
    if (m.room === this.room && this.visible()) this.append(m);
    else if (m.uid !== ME.uid) this.unread[m.room] = (this.unread[m.room] || 0) + 1;
    this.renderSide();
    Bus.emit('unread', this.totalUnread());
  },

  async send(type, text = '', data = '') {
    const m = { room: this.room, uid: ME.uid, name: ME.name, type, text, data };
    if (Store.online) {
      try { this.receive(await Store.api('POST', 'messages', m)); }
      catch (e) { UI.toast('Senden fehlgeschlagen: ' + e.message, 'err'); }
      return;
    }
    Object.assign(m, { id: uid(), ts: Date.now() });
    const all = LS.get('chatLocal', []);
    all.push(m);
    while (all.length > 300) all.shift();
    if (!LS.set('chatLocal', all)) {
      UI.toast('Speicher voll – ältere Bilder wurden entfernt', 'info');
      LS.set('chatLocal', all.filter(x => x.type !== 'image').slice(-200));
    }
    this.bc?.postMessage(m);
    this.receive(m);
  },

  async sendFile(file) {
    try { await this.send('image', '', await readImage(file, 1280, 0.8)); }
    catch (e) { UI.toast(e.message, 'err'); }
  },

  /* ---------- GIFs (GIPHY) ---------- */
  GIPHY_KEY: 'Mvntu3pdtUlrgqQ8w2MMtAYWJ2kwBK1U',
  gifReq: 0,
  gifTimer: null,

  toggleGifPicker(root) {
    const open = $('.gif-pop', root);
    if (open) return open.remove();
    $('.sticker-pop', root)?.remove();
    $('#composer', root).insertAdjacentHTML('beforeend', `<div class="gif-pop">
      <input class="input" id="gifSearch" type="search" placeholder="GIFs suchen" autocomplete="off" enterkeyhint="search">
      <div class="gif-grid" id="gifGrid"></div>
      <div class="gif-foot">Powered by GIPHY</div></div>`);
    const pop = $('.gif-pop', root), inp = $('#gifSearch', pop), grid = $('#gifGrid', pop);
    inp.addEventListener('input', () => {
      clearTimeout(this.gifTimer);
      this.gifTimer = setTimeout(() => this.loadGifs(grid, inp.value.trim()), 350);
    });
    inp.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      clearTimeout(this.gifTimer);
      this.loadGifs(grid, inp.value.trim());
      inp.blur();
    });
    grid.addEventListener('click', e => {
      const b = e.target.closest('[data-gifurl]');
      if (!b) return;
      pop.remove();
      this.send('image', '', b.dataset.gifurl);
    });
    this.loadGifs(grid, '');
  },

  async loadGifs(grid, q) {
    const id = ++this.gifReq;
    grid.innerHTML = '<div class="gif-info">Lade …</div>';
    const p = new URLSearchParams({ api_key: this.GIPHY_KEY, limit: '30', rating: 'pg-13' });
    if (q) { p.set('q', q); p.set('lang', 'de'); }
    try {
      const r = await fetch('https://api.giphy.com/v1/gifs/' + (q ? 'search' : 'trending') + '?' + p.toString());
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const items = (await r.json()).data || [];
      if (id !== this.gifReq || !grid.isConnected) return;
      const ok = u => typeof u === 'string' && /^https:\/\/(media\d*|i)\.giphy\.com\//.test(u);
      const html = items.map(it => {
        const im = it.images || {};
        const prev = im.fixed_width_small || im.fixed_width || {};
        const send = im.downsized || im.fixed_width || {};
        if (!ok(prev.url) || !ok(send.url)) return '';
        const w = +prev.width, h = +prev.height;
        return `<button type="button" class="gif-item" data-gifurl="${esc(send.url)}"><img src="${esc(prev.url)}" alt="" loading="lazy"${w && h ? ` style="aspect-ratio:${w}/${h}"` : ''}></button>`;
      }).join('');
      grid.innerHTML = html || '<div class="gif-info">Keine GIFs gefunden.</div>';
    } catch (e) {
      if (id === this.gifReq && grid.isConnected) grid.innerHTML = '<div class="gif-info">GIFs konnten nicht geladen werden.</div>';
    }
  },

  /* ---------- Darstellung ---------- */
  mount(root) {
    this.root = root;
    root.innerHTML = `
      <div class="card flush chat ${this.room !== 'global' || this.mobileInRoom ? 'in-room' : ''}">
        <aside class="chat-side">
          <div class="chat-me">${UI.avatar(ME.name || '?')}<div class="name">${esc(ME.name || 'Ohne Namen')}<div class="faint" style="font-size:12px;font-weight:400">${Store.online ? 'Online' : 'Offline-Modus'}</div></div>
</div>
          <div class="chat-rooms" id="rooms"></div>
        </aside>
        <div class="chat-main">
          <div class="chat-head" id="chatHead"></div>
          <div class="messages" id="messages"></div>
          <form class="composer" id="composer">
            <button type="button" class="btn icon ghost" data-photo title="Foto senden">${icon('image')}</button>
            <button type="button" class="btn icon ghost gif" data-gif title="GIF senden">GIF</button>
            <button type="button" class="btn icon ghost" data-sticker title="Sticker">${icon('smile')}</button>
            <input class="input" id="msgInput" autocomplete="off" maxlength="2000" placeholder="Nachricht schreiben …">
            <button class="btn primary icon" title="Senden">${icon('send')}</button>
            <input type="file" id="filePhoto" accept="image/*" hidden><input type="file" id="fileGif" accept="image/gif" hidden>
          </form>
        </div>
      </div>`;
    const chat = $('.chat', root);
    this.renderSide(); this.renderHead(); this.renderMessages();

    $('#rooms', root).onclick = async e => {
      const b = e.target.closest('[data-room]'); if (!b) return;
      this.room = b.dataset.room; this.mobileInRoom = true;
      chat.classList.add('in-room');
      await this.load(this.room);
      this.unread[this.room] = 0; Bus.emit('unread', this.totalUnread());
      this.renderSide(); this.renderHead(); this.renderMessages();
      $('#msgInput', root).focus({ preventScroll: true });
    };
    root.addEventListener('click', e => {
      const t = e.target.closest('[data-back],[data-photo],[data-gif],[data-sticker],[data-s]');
      if (e.target.matches('.bubble.media img')) return UI.showImage(e.target.src);
      if (!e.target.closest('.sticker-pop,[data-sticker]')) $('.sticker-pop', root)?.remove();
      if (!e.target.closest('.gif-pop,[data-gif]')) $('.gif-pop', root)?.remove();
      if (!t) return;
      const ds = t.dataset;
      if (ds.back != null) { this.mobileInRoom = false; chat.classList.remove('in-room'); }
      else if (ds.photo != null) $('#filePhoto', root).click();
      else if (ds.gif != null) this.toggleGifPicker(root);
      else if (ds.sticker != null) {
        const open = $('.sticker-pop', root);
        if (open) return open.remove();
        $('#composer', root).insertAdjacentHTML('beforeend', `<div class="sticker-pop">${this.STICKERS.map(s => `<button type="button" data-s="${s}">${s}</button>`).join('')}</div>`);
      } else if (ds.s) { this.send('sticker', ds.s); $('.sticker-pop', root)?.remove(); }
    });
    $('#composer', root).onsubmit = e => {
      e.preventDefault();
      const inp = $('#msgInput', root), t = inp.value.trim();
      if (!t) return;
      inp.value = '';
      this.send('text', t);
    };
    for (const id of ['#filePhoto', '#fileGif']) $(id, root).onchange = e => { [...e.target.files].forEach(f => this.sendFile(f)); e.target.value = ''; };
    $('#msgInput', root).addEventListener('paste', e => {
      const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/'));
      if (f) { e.preventDefault(); this.sendFile(f); }
    });
    chat.addEventListener('dragover', e => { e.preventDefault(); chat.classList.add('drop'); });
    chat.addEventListener('dragleave', e => { if (!chat.contains(e.relatedTarget)) chat.classList.remove('drop'); });
    chat.addEventListener('drop', e => { e.preventDefault(); chat.classList.remove('drop'); [...e.dataTransfer.files].forEach(f => this.sendFile(f)); });

    this.unread[this.room] = 0; Bus.emit('unread', this.totalUnread());
  },

  renderSide() {
    const el = this.root?.isConnected && $('#rooms', this.root);
    if (!el) return;
    for (const r of Object.keys(this.msgs)) if (r.startsWith('dm:')) {
      const o = this.otherOf(r), m = this.msgs[r].find(x => x.uid === o);
      if (o && !this.users[o] && m) this.users[o] = { uid: o, name: m.name };
    }
    const last = r => { const l = this.msgs[r]; const m = l?.[l.length - 1]; return m ? (m.uid === ME.uid ? 'Du: ' : m.room === 'global' ? m.name + ': ' : '') + (m.type === 'image' ? '📷 Bild' : m.text) : ''; };
    const badge = r => this.unread[r] ? `<span class="badge">${this.unread[r]}</span>` : '';
    const people = Object.values(this.users).filter(u => u.uid !== ME.uid && u.name)
      .sort((a, b) => (b.online ? 1 : 0) - (a.online ? 1 : 0) || a.name.localeCompare(b.name, 'de'));
    el.innerHTML = `
      <button class="room ${this.room === 'global' ? 'active' : ''}" data-room="global"><span class="room-icon">${icon('users')}</span>
        <span class="r-body"><div class="r-name">Klassenchat</div><div class="r-sub">${esc(last('global')) || 'Für alle in der Klasse'}</div></span>${badge('global')}</button>
      <div class="nav-label">Private Chats</div>
      ${people.map(u => {
        const r = this.dmRoom(u.uid);
        return `<button class="room ${this.room === r ? 'active' : ''}" data-room="${esc(r)}"><span class="avatar-wrap">${UI.avatar(u.name)}<span class="presence ${u.online ? 'on' : ''}"></span></span>
          <span class="r-body"><div class="r-name">${esc(u.name)}</div><div class="r-sub">${esc(last(r)) || (u.online ? 'Online' : 'Offline')}</div></span>${badge(r)}</button>`;
      }).join('') || `<p class="faint" style="font-size:13px;padding:6px 10px">${Store.online ? 'Sobald andere die Seite öffnen, kannst du ihnen hier privat schreiben.' : 'Private Chats funktionieren nur, wenn die Seite über den Server läuft.'}</p>`}`;
  },

  renderHead() {
    const el = this.root?.isConnected && $('#chatHead', this.root);
    if (!el) return;
    const g = this.room === 'global';
    const other = g ? null : this.users[this.otherOf(this.room)];
    const online = Object.values(this.users).filter(u => u.online).length;
    el.innerHTML = `<button class="btn ghost icon sm chat-back" data-back>${icon('left')}</button>
      ${g ? `<span class="room-icon">${icon('users')}</span>` : UI.avatar(other?.name || '?')}
      <div><div class="t">${esc(this.roomName(this.room))}</div><div class="s">${g ? (Store.online ? `${online} online` : 'Nur auf diesem Gerät') : other?.online ? 'Online' : 'Offline'}</div></div>`;
  },

  msgHTML(m, prev) {
    const mine = m.uid === ME.uid, d = new Date(m.ts);
    let html = '';
    if (!prev || !sameDay(new Date(prev.ts), d)) html += `<div class="day-sep">${sameDay(d, new Date()) ? 'Heute' : fmt.dateLong(d)}</div>`;
    const first = !prev || prev.uid !== m.uid || m.ts - prev.ts > 5 * 60e3 || !sameDay(new Date(prev.ts), d);
    const tm = `<span class="tm">${fmt.time(d)}</span>`;
    let body;
    if (m.type === 'image') body = `<div class="bubble media"><img src="${esc(m.data)}" alt="Bild" loading="lazy"></div>`;
    else if (m.type === 'sticker') body = `<div class="bubble sticker" title="${fmt.time(d)}">${esc(m.text)}</div>`;
    else body = `<div class="bubble">${esc(m.text)}${tm}</div>`;
    return html + `<div class="msg-row ${mine ? 'mine' : ''} ${first ? 'first' : ''}">${mine ? '' : UI.avatar(m.name, 'sm')}
      <div class="msg-col">${first && !mine && this.room === 'global' ? `<div class="msg-name">${esc(m.name)}</div>` : ''}${body}</div></div>`;
  },

  renderMessages() {
    const el = this.root?.isConnected && $('#messages', this.root);
    if (!el) return;
    const list = this.msgs[this.room] || [];
    el.innerHTML = list.map((m, i) => this.msgHTML(m, list[i - 1])).join('') ||
      UI.empty('chat', 'Noch keine Nachrichten', 'Schreib die erste! ✍️');
    if (!list.length) el.firstElementChild.style.margin = 'auto';
    this.scrollDown(el, true);
  },

  append(m) {
    const el = $('#messages', this.root), list = this.msgs[this.room];
    if (list.length === 1) return this.renderMessages();
    const near = el.scrollHeight - el.scrollTop - el.clientHeight < 160;
    el.insertAdjacentHTML('beforeend', this.msgHTML(m, list[list.length - 2]));
    if (near || m.uid === ME.uid) this.scrollDown(el, true);
  },

  scrollDown(el) {
    el.scrollTop = el.scrollHeight;
    $$('img', el).forEach(i => i.complete || i.addEventListener('load', () => { el.scrollTop = el.scrollHeight; }, { once: true }));
  },
};

Pages.chat = {
  title: () => 'Chat',
  subtitle: () => Store.online ? 'Schreib mit deiner Klasse – live' : 'Offline-Modus: nur auf diesem Gerät',
  render(root) { Chat.mount(root); },
};

'use strict';
/* ==========================================================
   Einstellungen
   ========================================================== */
Pages.settings = {
  tab: 'general',
  draft: null,
  dirty: false,
  planWeek: 'A',
  TABS: [
    ['general', 'Allgemein', 'settings'],
    ['plan', 'Blockplan', 'clock'],
    ['holidays', 'Ferien', 'palm'],
    ['panic', 'Notfall-Knopf', 'shield'],
    ['data', 'Daten', 'database'],
  ],

  title: () => 'Einstellungen',
  subtitle: () => Store.online ? 'Änderungen gelten für die ganze Klasse' : 'Offline-Modus: gilt nur in diesem Browser',

  render(root, arg) {
    if (arg && this.TABS.some(t => t[0] === arg)) this.tab = arg;
    if (!this.dirty) this.draft = structuredClone(Data.cfg);
    this.root = root;
    root.innerHTML = `<div class="settings">
      <nav class="settings-nav">${this.TABS.map(([k, l, i]) => `<button data-tab="${k}" class="${this.tab === k ? 'active' : ''}">${icon(i)} ${l}</button>`).join('')}</nav>

    $('.settings-nav', root).onclick = e => {
      const b = e.target.closest('[data-tab]'); if (!b) return;
      this.tab = b.dataset.tab;
      history.replaceState(null, '', '#settings/' + this.tab);
      $$('.settings-nav button', root).forEach(x => x.classList.toggle('active', x === b));
      this.renderPanel();
    };
    this.renderPanel();
  },

  saveBar() {
    return `<div class="save-bar"><span class="state ${this.dirty ? 'dirty' : ''}" id="saveState">${this.dirty ? '● Ungespeicherte Änderungen' : 'Alles gespeichert'}</span><div class="spacer"></div>
      <button class="btn ghost" data-reset ${this.dirty ? '' : 'disabled'}>Verwerfen</button><button class="btn primary" data-save ${this.dirty ? '' : 'disabled'}>${icon('check')} Speichern</button></div>`;
  },
  markDirty() {
    this.dirty = true;
    const s = $('#saveState', this.root);
    if (s) { s.textContent = '● Ungespeicherte Änderungen'; s.classList.add('dirty'); }
    $$('[data-save],[data-reset]', this.root).forEach(b => b.disabled = false);
  },

  renderPanel() {
    const p = $('#panel', this.root), d = this.draft;
    const views = {
      general: () => `
        <section class="card"><h3>Klasse</h3><p class="meta">Name und Klassenstufe für Seitenleiste und Countdown.</p>
          <div class="form-grid cols-2">
            <label class="field"><span>Name der Klasse</span><input class="input" data-k="className" maxlength="40" value="${esc(d.className)}"></label>
            <label class="field"><span>Aktuelle Klassenstufe</span><input class="input" type="number" min="1" max="13" data-k="grade" value="${esc(d.grade)}"></label>
          </div></section>
        <section class="card"><h3>Dein Konto</h3><p class="meta">Mit diesem Namen erscheinst du im Chat und in den Arcade-Bestenlisten.</p>
          <div class="row">${UI.avatar(ME.name)}<b style="flex:1">${esc(ME.name)}</b><button class="btn" data-logout>${icon('arrowRight')} Abmelden</button></div></section>
        <section class="card"><h3>Darstellung</h3><p class="meta">Gilt nur für dieses Gerät. „Automatisch“ folgt der Einstellung des iPads.</p>
          <div class="seg">${Object.entries(Prefs.THEMES).map(([k, l]) => `<button data-theme="${k}" class="${Prefs.theme === k ? 'active' : ''}">${icon(k === 'light' ? 'sun' : k === 'dark' ? 'moon' : 'layers', 'i-sm')} ${l}</button>`).join('')}</div></section>
        <section class="card"><h3>Lautstärke</h3><p class="meta">Für die Spiele im Arcade. Gilt nur für dieses Gerät.</p>
          <div id="volBox" style="max-width:420px">${Arcade.volumeControl()}</div></section>
        ${this.saveBar()}`,

      plan: () => {
        const w = d.schedule[this.planWeek] ||= {};
        return `
        <section class="card"><h3>Block-Zeiten</h3><p class="meta">Beginn und Ende jedes Unterrichtsblocks.</p>
          <div class="scroll-x"><table class="table"><thead><tr><th>Block</th><th>Beginn</th><th>Ende</th><th></th></tr></thead><tbody>
          ${d.blocks.map((b, i) => `<tr><td class="faint" style="width:60px">${i + 1}</td><td><input class="input" type="time" data-b="${i}" data-f="start" value="${b.start}"></td>
            <td><input class="input" type="time" data-b="${i}" data-f="end" value="${b.end}"></td><td style="width:44px"><button class="btn ghost icon sm danger" data-rmblock="${i}" title="Block entfernen">${icon('trash')}</button></td></tr>`).join('')}
          </tbody></table></div>
          <button class="btn sm" data-addblock style="margin-top:6px">${icon('plus')} Block hinzufügen</button></section>
        <section class="card"><h3>A- und B-Woche</h3><p class="meta">Ein beliebiger Montag aus einer A-Woche – daraus wird jede weitere Woche berechnet.</p>
          <div class="form-grid cols-2"><label class="field"><span>Montag einer A-Woche</span><input class="input" type="date" data-k="aWeekRef" value="${esc(d.aWeekRef)}"></label>
          <div class="field"><span>Ergebnis</span><div class="input" style="display:flex;align-items:center" id="refInfo">${this.refInfo()}</div></div></div></section>
        <section class="card"><div class="row wrap" style="margin-bottom:14px"><div style="flex:1"><h3>Fächer</h3><p class="meta">Leeres Feld = frei. Raum und Lehrkraft optional mit „·“, z. B. <code>Mathe · R215 · RudT</code>.</p></div>
          <div class="seg" id="planSeg"><button data-pw="A" class="${this.planWeek === 'A' ? 'active' : ''}">A-Woche</button><button data-pw="B" class="${this.planWeek === 'B' ? 'active' : ''}">B-Woche</button></div></div>
          <div class="scroll-x"><table class="table" style="min-width:680px"><thead><tr><th></th>${['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag'].map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>
          ${d.blocks.map((b, i) => `<tr><td class="faint" style="font-size:12px;width:70px">Block ${i + 1}<br>${b.start}</td>${[1, 2, 3, 4, 5].map(dow =>
            `<td><input class="input" data-dow="${dow}" data-i="${i}" placeholder="frei" maxlength="40" value="${esc((w[dow] || [])[i] || '')}" list="subjAll"></td>`).join('')}</tr>`).join('')}
          </tbody></table></div><datalist id="subjAll">${Data.subjects().map(s => `<option value="${esc(s)}">`).join('')}</datalist></section>
        ${this.saveBar()}`;
      },

      holidays: () => `
        <section class="card"><h3>Ferien</h3><p class="meta">Die Ferien mit „Sommer“ im Namen gelten als Ende des Schuljahrs. In den Ferien entfallen alle Blöcke.</p>
          <div class="scroll-x"><table class="table" style="min-width:560px"><thead><tr><th>Name</th><th>Erster Tag</th><th>Letzter Tag</th><th></th></tr></thead><tbody>
          ${d.holidays.map((h, i) => `<tr><td><input class="input" data-h="${i}" data-f="name" value="${esc(h.name)}"></td><td><input class="input" type="date" data-h="${i}" data-f="start" value="${h.start}"></td>
            <td><input class="input" type="date" data-h="${i}" data-f="end" value="${h.end}"></td><td style="width:44px"><button class="btn ghost icon sm danger" data-rmhol="${i}">${icon('trash')}</button></td></tr>`).join('')}
          </tbody></table></div>
          <button class="btn sm" data-addhol style="margin-top:6px">${icon('plus')} Ferien hinzufügen</button></section>
        ${this.saveBar()}`,

      panic: () => {
        const mode = LS.get('panicMode', 'apple'), imgs = LS.get('panicImgs', []), sel = LS.get('panicSel', 'random');
        return `
        <section class="card"><h3>Was soll angezeigt werden?</h3><p class="meta">Der rote Knopf oben rechts schaltet sofort auf Vollbild. Beenden mit <kbd>Esc</kbd> oder Doppelklick. Gilt nur in diesem Browser.</p>
          <div class="option-cards">
            <label class="option-card"><input type="radio" name="pmode" value="apple" ${mode === 'apple' ? 'checked' : ''}><div><div class="preview-apple"><svg viewBox="0 0 100 110">${$('.panic-logo').innerHTML}</svg><i></i></div><b>Update-Bildschirm</b><small>Apfel-Logo mit Ladebalken</small></div></label>
            <label class="option-card"><input type="radio" name="pmode" value="image" ${mode === 'image' ? 'checked' : ''}><div><div class="preview-img">${icon('image', 'i-lg')}</div><b>Eigenes Bild</b><small>${imgs.length ? imgs.length + ' Bild' + (imgs.length > 1 ? 'er' : '') + ' hochgeladen' : 'Noch kein Bild hochgeladen'}</small></div></label>
          </div>
          <div class="row" style="margin-top:16px"><button class="btn" data-ptest>${icon('play')} Ausprobieren</button></div></section>
        <section class="card"><h3>Eigene Bilder</h3><p class="meta">Klick auf ein Bild, um es fest auszuwählen.</p>
          <div class="thumbs">${imgs.map((src, i) => `<button class="thumb ${sel === i ? 'sel' : ''}" data-psel="${i}"><img src="${src}" alt=""><span class="rm" data-prm="${i}" title="Entfernen">${icon('x', 'i-sm')}</span></button>`).join('')}
            <button class="thumb" data-pup style="display:grid;place-items:center;color:var(--text-2);border-style:dashed">${icon('upload', 'i-lg')}</button></div>
          ${imgs.length > 1 ? `<label class="check" style="margin-top:14px"><input type="checkbox" data-prandom ${sel === 'random' ? 'checked' : ''}> Jedes Mal ein zufälliges Bild zeigen</label>` : ''}
          <input type="file" id="pFile" accept="image/*" multiple hidden></section>`;
      },

      data: () => `
        <section class="card"><h3>Speicherort</h3>
          ${Store.online
            ? `<div class="notice info">${icon('info')}<div>Die Seite ist mit dem Server verbunden. Kalender, Einstellungen, Chat und Bestenlisten sind für alle gleich.</div></div>`
            : `<div class="notice">${icon('alert')}<div>Offline-Modus: Alles wird nur in diesem Browser gespeichert. Damit alle dieselben Daten sehen, starte die Seite mit <code>node server.js</code>.</div></div>`}</section>
        <section class="card"><h3>Sichern &amp; Wiederherstellen</h3><p class="meta">Kalender und Einstellungen als Datei sichern – z. B. um sie auf den Server zu übertragen.</p>
          <div class="row wrap"><button class="btn" data-export>${icon('download')} Exportieren</button><button class="btn" data-import>${icon('upload')} Importieren</button>
          <div class="spacer"></div><button class="btn danger" data-sample>${icon('refresh')} Standard-Stundenplan laden</button></div>
          <input type="file" id="importFile" accept="application/json,.json" hidden></section>`,
    };
    p.innerHTML = views[this.tab]();
    p.oninput = e => this.onInput(e);
    p.onchange = e => this.onChange(e);
    p.onclick = e => this.onClick(e);
    if ($('#volBox', p)) Arcade.bindVolume($('#volBox', p));
    const pf = $('#pFile', p);
    if (pf) pf.onchange = e => this.uploadPanic(e.target.files);
    const imp = $('#importFile', p);
    if (imp) imp.onchange = e => this.importFile(e.target.files[0]);
  },

  refInfo() {
    const saved = Data.cfg.aWeekRef;
    Data.cfg.aWeekRef = this.draft.aWeekRef;
    const mon = Schedule.focusMonday();
    const txt = `${fmt.dateFull(mon)}: <b style="margin-left:4px">${Schedule.weekType(mon)}-Woche</b>`;
    Data.cfg.aWeekRef = saved;
    return txt;
  },

  onInput(e) {
    const t = e.target, ds = t.dataset, d = this.draft;
    if (ds.k) d[ds.k] = ds.k === 'grade' ? Number(t.value) || 1 : t.value;
    else if (ds.b != null) d.blocks[ds.b][ds.f] = t.value;
    else if (ds.dow != null) { const w = d.schedule[this.planWeek] ||= {}; (w[ds.dow] ||= [])[ds.i] = t.value; }
    else if (ds.h != null) d.holidays[ds.h][ds.f] = t.value;
    else return;
    if (ds.k === 'aWeekRef') $('#refInfo', this.root).innerHTML = this.refInfo();
    this.markDirty();
  },

  onChange(e) {
    const t = e.target;
    if (t.name === 'pmode') { LS.set('panicMode', t.value); UI.toast('Notfall-Anzeige geändert'); }
    if (t.dataset.prandom != null) { LS.set('panicSel', t.checked ? 'random' : 0); this.renderPanel(); }
  },

  async onClick(e) {
    const t = e.target.closest('button, [data-prm]'); if (!t) return;
    const ds = t.dataset, d = this.draft;
    if (ds.theme) { Prefs.setTheme(ds.theme); return this.renderPanel(); }
    if (ds.save != null) return this.save();
    if (ds.reset != null) { this.dirty = false; this.draft = structuredClone(Data.cfg); return this.renderPanel(); }
    if (ds.addblock != null) { const last = d.blocks[d.blocks.length - 1]; d.blocks.push({ start: last?.end || '08:00', end: last?.end || '09:30' }); }
    else if (ds.rmblock != null) {
      d.blocks.splice(+ds.rmblock, 1);
      for (const w of ['A', 'B']) for (const k in d.schedule[w] || {}) d.schedule[w][k].splice(+ds.rmblock, 1);
    } else if (ds.pw) { this.planWeek = ds.pw; return this.renderPanel(); }
    else if (ds.addhol != null) d.holidays.push({ name: 'Ferien', start: '', end: '' });
    else if (ds.rmhol != null) d.holidays.splice(+ds.rmhol, 1);
    else if (ds.ptest != null) return Panic.show();
    else if (ds.pup != null) return $('#pFile', this.root).click();
    else if (ds.prm != null) {
      e.stopPropagation();
      const imgs = LS.get('panicImgs', []); imgs.splice(+ds.prm, 1); LS.set('panicImgs', imgs);
      if (LS.get('panicSel', 'random') !== 'random') LS.set('panicSel', 0);
      return this.renderPanel();
    } else if (ds.psel != null) { LS.set('panicSel', +ds.psel); LS.set('panicMode', 'image'); return this.renderPanel(); }
    else if (ds.export != null) return this.exportFile();
    else if (ds.import != null) return $('#importFile', this.root).click();
    else if (ds.sample != null) {
      if (!await UI.confirm('Alle Einstellungen werden auf den Standard-Stundenplan der Klasse zurückgesetzt.', { ok: 'Zurücksetzen', danger: true })) return;
      await Data.saveConfig(structuredClone(DEFAULT_CONFIG)); this.dirty = false;
      return UI.toast('Standard-Stundenplan geladen');
    } else return;
    this.markDirty();
    this.renderPanel();
  },

  async save() {
    const d = this.draft;
    d.blocks.sort((a, b) => a.start.localeCompare(b.start));
    d.holidays = d.holidays.filter(h => h.name && h.start && h.end).map(h => h.end < h.start ? { ...h, end: h.start } : h);
    try {
      await Data.saveConfig(d);
      this.dirty = false;
      UI.toast('Einstellungen gespeichert');
      App.refresh();
    } catch (err) { UI.toast(err.message, 'err'); }
  },

  async uploadPanic(files) {
    const imgs = LS.get('panicImgs', []);
    for (const f of files) {
      try { imgs.push(await readImage(f, 1920, 0.85)); } catch (err) { UI.toast(err.message, 'err'); }
    }
    if (!LS.set('panicImgs', imgs)) UI.toast('Browser-Speicher voll – entferne ein Bild.', 'err');
    else { LS.set('panicMode', 'image'); UI.toast('Bild hinzugefügt'); }
    this.renderPanel();
  },

  exportFile() {
    const blob = new Blob([JSON.stringify({ config: Data.cfg, events: Data.events }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `klassen-hub-${ymd(new Date())}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },

  async importFile(file) {
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (data.config) await Data.saveConfig(Data.normalize(data.config));
      let n = 0;
      if (Array.isArray(data.events)) for (const ev of data.events) {
        if (Data.events.some(x => x.date === ev.date && x.title === ev.title)) continue;
        const { id, ...rest } = ev;
        await Data.saveEvent(rest); n++;
      }
      this.dirty = false;
      UI.toast(`Importiert (${n} Einträge)`);
      App.refresh();
    } catch (err) { UI.toast('Import fehlgeschlagen: ' + err.message, 'err'); }
  },
};
