  <script>/* js/arcade/engine.js */
'use strict';
/* ==========================================================
   Arcade-Engine
   Stellt jedem Spiel bereit: Spielschleife, Eingabe (Tastatur,
   Maus, Touch), Partikel, Bildschirmwackeln, Sound, Punkte mit
   Combo-Multiplikator, Leben, Levels, Pause, Rekorde, Bestenliste.

   Ein Spiel wird so definiert:
     Arcade.define({ id, name, desc, cat, glyph, colors:[c1,c2], w, h, lives,
                     controls, touch, init(g), update(g, dt), draw(g, ctx) })
   ========================================================== */
const Arcade = (() => {
  const games = [];
  let active = null;
  let classBoard = {}; // gameId -> [{name, score, uid}]

  /* ---------- Sound (synthetisch, keine Dateien nötig) ---------- */
  const Sound = {
    ctx: null, master: null,
    get muted() { return Prefs.volume === 0; },
    gainFor: v => 0.5 * Math.pow(v / 100, 1.6),
    init() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!this.ctx) {
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.gainFor(Prefs.volume);
        this.master.connect(this.ctx.destination);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    },
    tone(f, d = 0.1, { type = 'square', f2 = 0, v = 0.25, delay = 0 } = {}) {
      if (this.muted || !this.ctx) return;
      const t = this.ctx.currentTime + delay;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + d);
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(0.0008, t + d);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + d + 0.03);
    },
    noise(d = 0.25, v = 0.3, freq = 1000) {
      if (this.muted || !this.ctx) return;
      const len = Math.floor(this.ctx.sampleRate * d);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
      src.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = v;
      src.connect(f); f.connect(g); g.connect(this.master); src.start();
    },
  };
  const arp = (notes, step, opt) => notes.forEach((f, i) => Sound.tone(f, step * 1.6, { ...opt, delay: i * step }));
  const sfx = {
    shoot: () => Sound.tone(900, 0.07, { f2: 300, v: 0.08 }),
    laser: () => Sound.tone(1400, 0.12, { f2: 200, v: 0.08, type: 'sawtooth' }),
    hit: () => Sound.tone(260, 0.07, { type: 'square', f2: 120, v: 0.12 }),
    boom: () => { Sound.noise(0.4, 0.45, 800); Sound.tone(120, 0.3, { f2: 40, type: 'sine', v: 0.3 }); },
    pop: () => Sound.tone(500 + Math.random() * 300, 0.06, { f2: 1200, type: 'sine', v: 0.18 }),
    coin: () => { Sound.tone(988, 0.07, { v: 0.12 }); Sound.tone(1319, 0.14, { v: 0.12, delay: 0.07 }); },
    power: () => arp([523, 659, 784, 1047, 1319], 0.055, { type: 'triangle', v: 0.13 }),
    jump: () => Sound.tone(320, 0.14, { f2: 720, type: 'triangle', v: 0.14 }),
    bounce: () => Sound.tone(520, 0.05, { type: 'sine', v: 0.14 }),
    blip: () => Sound.tone(700, 0.04, { v: 0.07 }),
    hurt: () => { Sound.noise(0.25, 0.35, 600); Sound.tone(180, 0.25, { f2: 50, type: 'sawtooth', v: 0.18 }); },
    level: () => arp([523, 784, 1047, 1568], 0.08, { type: 'triangle', v: 0.15 }),
    lose: () => arp([392, 311, 262, 196], 0.15, { type: 'sawtooth', v: 0.12 }),
    win: () => arp([523, 659, 784, 1047, 784, 1047, 1319], 0.09, { type: 'triangle', v: 0.14 }),
    note: f => Sound.tone(f, 0.18, { type: 'triangle', v: 0.16 }),
    whoosh: () => Sound.noise(0.15, 0.15, 2500),
  };

  /* ---------- Effekte ---------- */
  class FX {
    constructor() { this.parts = []; this.texts = []; this.rings = []; this.shakeT = 0; this.shakeMag = 0; this.flashA = 0; this.flashC = '#fff'; }
    burst(x, y, color = '#fff', n = 16, speed = 240, size = 3, life = 0.6, grav = 0) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, v = speed * (0.25 + Math.random() * 0.75);
        this.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: life * (0.5 + Math.random() * 0.5), max: life, color, size: size * (0.6 + Math.random() * 0.8), grav });
      }
      if (this.parts.length > 900) this.parts.splice(0, this.parts.length - 900);
    }
    trail(x, y, color, size = 3, life = 0.3, vx = 0, vy = 0) { this.parts.push({ x, y, vx, vy, life, max: life, color, size, grav: 0 }); }
    text(x, y, str, color = '#fff', size = 18) { this.texts.push({ x, y, str, color, size, life: 0.9 }); }
    ring(x, y, color = '#fff', r = 50, life = 0.4) { this.rings.push({ x, y, color, r, life, max: life }); }
    shake(mag = 8, t = 0.25) { this.shakeMag = Math.max(this.shakeMag, mag); this.shakeT = Math.max(this.shakeT, t); }
    flash(color = '#fff', a = 0.3) { this.flashC = color; this.flashA = a; }
    update(dt) {
      for (const p of this.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.grav * dt; p.vx *= 1 - 2 * dt; p.vy *= 1 - 2 * dt; p.life -= dt; }
      this.parts = this.parts.filter(p => p.life > 0);
      for (const t of this.texts) { t.y -= 40 * dt; t.life -= dt; }
      this.texts = this.texts.filter(t => t.life > 0);
      for (const r of this.rings) r.life -= dt;
      this.rings = this.rings.filter(r => r.life > 0);
      this.shakeT = Math.max(0, this.shakeT - dt);
      this.flashA = Math.max(0, this.flashA - dt * 1.5);
    }
    offset() {
      if (this.shakeT <= 0) return [0, 0];
      const m = this.shakeMag * Math.min(1, this.shakeT * 4);
      return [(Math.random() - 0.5) * m * 2, (Math.random() - 0.5) * m * 2];
    }
    draw(c, W, H) {
      c.save();
      c.globalCompositeOperation = 'source-over';
      for (const p of this.parts) {
        c.globalAlpha = Math.max(0, p.life / p.max);
        c.fillStyle = p.color;
        c.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      }
      for (const r of this.rings) {
        const k = 1 - r.life / r.max;
        c.globalAlpha = 1 - k;
        c.strokeStyle = r.color; c.lineWidth = 3 * (1 - k) + 1;
        c.beginPath(); c.arc(r.x, r.y, r.r * (0.2 + k), 0, Math.PI * 2); c.stroke();
      }
      c.restore();
      c.save();
      c.textAlign = 'center'; c.textBaseline = 'middle';
      for (const t of this.texts) {
        c.globalAlpha = Math.min(1, t.life * 2);
        c.font = `700 ${t.size}px "Space Grotesk", system-ui, sans-serif`;
        c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 4;
        c.fillStyle = t.color; c.fillText(t.str, t.x, t.y);
      }
      c.restore();
      if (this.flashA > 0) { c.save(); c.globalAlpha = this.flashA; c.fillStyle = this.flashC; c.fillRect(0, 0, W, H); c.restore(); }
    }
  }

  /* ---------- Eingabe ---------- */
  const KEYMAP = {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down', Space: 'space', Enter: 'enter', ShiftLeft: 'shift', ShiftRight: 'shift', KeyP: 'p',
  };
  const TOUCH_LABEL = { left: '◀', right: '▶', up: '▲', down: '▼' };
  const TOUCH = matchMedia('(pointer: coarse)').matches;

  /** Touch-Pad je nach Spiel: Steuerkreuz, Links/Rechts-Paar oder einzelne Aktionstasten */
  const padHTML = def => {
    const t = def.touch || [];
    const has = k => t.includes(k);
    const label = k => (def.touchLabels && def.touchLabels[k]) || TOUCH_LABEL[k] || def.touchLabel || '●';
    const btn = (k, cls = k === 'fire' ? 'fire' : '') => `<button type="button"${cls ? ` class="${cls}"` : ''} data-k="${k}" aria-label="${k}">${label(k)}</button>`;
    const dirs = ['left', 'right', 'up', 'down'].filter(has);
    let left = '', right = '';
    if (dirs.length === 4) {
      left = `<div class="dpad">${btn('up', 'u')}${btn('left', 'l')}${btn('right', 'r')}${btn('down', 'd')}</div>`;
      right = t.filter(k => !dirs.includes(k)).map(k => btn(k)).join('');
    } else if (has('left') || has('right')) {
      const acts = t.filter(k => k !== 'left' && k !== 'right');
      if (!acts.length) { left = btn('left'); right = btn('right'); }
      else { left = ['left', 'right'].filter(has).map(k => btn(k)).join(''); right = acts.map(k => btn(k)).join(''); }
    } else {
      const vert = ['up', 'down'].filter(has);
      if (vert.length === 2) { left = vert.map(k => btn(k)).join(''); right = t.filter(k => !vert.includes(k)).map(k => btn(k)).join(''); }
      else right = t.map(k => btn(k)).join('');
    }
    const sticks = def.sticks || [];
    const stick = n => `<div class="stick" data-stick="${n}"><i class="knob"></i></div>`;
    if (sticks.includes('move')) left = stick('move');
    if (sticks.includes('aim')) right += stick('aim');
    return `<div class="touch-pad ${t.length || sticks.length ? 'on' : ''}"><div class="grp">${left}</div><div class="grp">${right}</div></div>`;
  };

  /* ---------- Rekorde ---------- */
  const best = id => LS.get('arc:' + id, 0);
  const stats = () => {
    const played = LS.get('arc:plays', 0);
    const records = games.filter(g => best(g.id) > 0).length;
    return { played, records };
  };
  async function loadBoards() {
    if (!Store.online) return;
    try { classBoard = await Store.api('GET', 'scores'); } catch { /* egal */ }
  }
  Bus.on('server:scores', b => { classBoard = b; });

  /* ---------- Spiel starten ---------- */
  function play(id, host) {
    stop();
    const def = games.find(g => g.id === id);
    if (!def) return;
    const W = def.w || 800, H = def.h || 500;
    host.innerHTML = `
      <div class="stage" style="--c1:${def.colors[0]};--c2:${def.colors[1]}">
        <canvas></canvas>
        <div class="hud">
          <div class="hud-pills"><span class="hud-pill score"><small>Punkte</small><b data-h="score">0</b></span>
          <span class="hud-pill" data-h="levelWrap"><small>Level</small><b data-h="level">1</b></span>
          <span class="hud-pill" data-h="livesWrap"><span data-h="lives"></span></span>
          <span class="hud-pill combo hidden" data-h="comboWrap">×<b data-h="combo">1</b></span></div>
          <div class="hud-btns"><button data-act="sound" title="Lautstärke">${icon(Prefs.volumeIcon())}</button><button data-act="pause" title="Pause (P)">${icon('pause')}</button>${TOUCH ? `<button data-act="rot" title="Bildschirm drehen">${icon('refresh')}</button><button data-act="exit" title="Zurück zur Übersicht">${icon('x')}</button>` : ''}</div>
        </div>
        ${padHTML(def)}
        <div data-h="overlay"></div>
      </div>`;
    const stage = $('.stage', host), canvas = $('canvas', stage), ctx = canvas.getContext('2d');
    const H$ = name => $(`[data-h="${name}"]`, stage);
    const pad = $('.touch-pad', stage);
    const panicBtn = document.getElementById('panicBtn');
    let rot = 0; // manuelle Drehung (0, 90, -90), nur wenn das Gerät im Hochformat bleibt
    if (TOUCH) {
      // Handy/iPad: Spiel füllt den Bildschirm, Seite dahinter wird gesperrt
      host.classList.add('arc-full');
      document.body.classList.add('arc-lock');
      document.body.appendChild(host);
      host.appendChild(pad);
      if (panicBtn) host.appendChild(panicBtn);
      rot = +LS.get('arcRot', 0) || 0;
      host.addEventListener('selectstart', e => e.preventDefault());
      host.addEventListener('contextmenu', e => e.preventDefault());
      host.addEventListener('dblclick', e => e.preventDefault());
    }
    const padNeed = TOUCH && pad.classList.contains('on') ? (pad.querySelector('.dpad') ? 216 : pad.querySelector('.stick') ? 168 : 100) : 0;
    const effRot = () => (innerWidth > innerHeight ? 0 : rot);
    const unrot = (dx, dy) => { const r = effRot(); return r === 90 ? [dy, -dx] : r === -90 ? [-dy, dx] : [dx, dy]; };
    let dpr = 1;
    const fit = () => {
      let w;
      if (TOUCH) {
        const r = effRot();
        const vv = window.visualViewport;
        const vw = Math.round(vv ? vv.width : innerWidth), vh = Math.round(vv ? vv.height : innerHeight);
        host.classList.toggle('rot90', r === 90);
        host.classList.toggle('rotm90', r === -90);
        if (r) {
          host.style.inset = 'auto'; host.style.width = vh + 'px'; host.style.height = vw + 'px';
          host.style.left = (r === 90 ? vw : 0) + 'px'; host.style.top = (r === 90 ? 0 : vh) + 'px';
        } else for (const k of ['inset', 'width', 'height', 'left', 'top']) host.style.removeProperty(k);
        const cw = host.clientWidth, ch = host.clientHeight, cs = getComputedStyle(host);
        const sl = parseFloat(cs.paddingLeft) || 0, sr = parseFloat(cs.paddingRight) || 0, st = parseFloat(cs.paddingTop) || 0, sb = parseFloat(cs.paddingBottom) || 0;
        const aw = cw - sl - sr, ah = ch - st - sb - (ch > cw ? padNeed : 0);
        const PB = 40, G = 8;
        w = Math.max(120, Math.min(aw, ah * W / H));
        let h = w * H / W, left = sl + (aw - w) / 2, top = st + (ah - h) / 2, px, py;
        // Platz für den Notfall-Knopf: erst seitlich, dann über dem Spielfeld, sonst Streifen oben reservieren
        const rightFree = cw - sr - (left + w);
        if (rightFree >= PB + 2 * G) { px = left + w + (rightFree - PB) / 2; py = st + G; }
        else if (top - st >= PB + 2 * G) { px = cw - sr - PB - G; py = st + G; }
        else {
          const res = PB + 2 * G;
          w = Math.max(120, Math.min(aw, (ah - res) * W / H)); h = w * H / W;
          left = sl + (aw - w) / 2; top = st + res + (ah - res - h) / 2; px = cw - sr - PB - G; py = st + G;
        }
        stage.style.left = left + 'px'; stage.style.top = top + 'px';
        if (panicBtn) { panicBtn.style.left = px + 'px'; panicBtn.style.top = py + 'px'; }
      } else {
        const maxW = host.clientWidth;
        const maxH = Math.max(260, innerHeight - (innerWidth < 900 ? 210 : 190));
        w = Math.min(maxW, maxH * W / H);
      }
      stage.style.width = w + 'px';
      stage.style.height = w * H / W + 'px';
      stage.classList.toggle('compact', w * H / W < 380);
      dpr = Math.min(2, window.devicePixelRatio || 1) * Math.max(1, w / W);
      dpr = Math.min(dpr, 2.5);
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    };
    fit();

    const held = new Set(), pressed = new Set();
    const ptr = { x: W / 2, y: H / 2, down: false, pressed: false, released: false, active: false };
    const fx = new FX();
    let state = 'title', last = performance.now(), raf = 0, overTimer = null, hudCache = {};

    /* --- Spiel-Objekt, das jedes Spiel bekommt --- */
    const g = {
      W, H, ctx, fx, sfx, ptr, def,
      stick: { move: { x: 0, y: 0, on: false }, aim: { x: 0, y: 0, on: false } },
      t: 0, score: 0, level: 1, lives: def.lives ?? 3, combo: 0, comboT: 0, s: {},
      get mult() { return Math.min(8, 1 + Math.floor(this.combo / 5)); },
      down: (...k) => k.some(x => held.has(x)),
      pressed: (...k) => k.some(x => pressed.has(x)),
      add(n, x, y, color = '#fff') {
        const pts = Math.round(n * g.mult);
        g.score += pts;
        if (x != null) fx.text(x, y, '+' + pts, color, pts >= 100 ? 22 : 17);
        return pts;
      },
      bump() { g.combo++; g.comboT = def.comboTime || 2.2; if (g.combo % 5 === 0 && g.combo <= 35) { sfx.coin(); } },
      breakCombo() { g.combo = 0; g.comboT = 0; },
      nextLevel(sub = '') { g.level++; g.banner('Level ' + g.level, sub); sfx.level(); },
      banner(title, sub = '') {
        const b = document.createElement('div');
        b.className = 'banner';
        b.innerHTML = esc(title) + (sub ? `<small>${esc(sub)}</small>` : '');
        stage.appendChild(b);
        setTimeout(() => b.remove(), 1700);
      },
      hurt(x, y) {
        if (state !== 'play') return true;
        g.lives--; g.breakCombo();
        sfx.hurt(); fx.shake(14, 0.35); fx.flash('#f43f5e', 0.28);
        if (x != null) fx.burst(x, y, '#f43f5e', 30, 300, 4, 0.8);
        if (g.lives <= 0) { g.end(); return true; }
        return false;
      },
      end(won = false) {
        if (state !== 'play') return;
        state = 'ending';
        if (won) sfx.win(); else { sfx.lose(); fx.shake(16, 0.5); }
        overTimer = setTimeout(() => showOver(won), won ? 600 : 900);
      },
      // Mathe-Helfer
      rnd: (a, b) => a + Math.random() * (b - a),
      rndi: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
      pick: arr => arr[Math.floor(Math.random() * arr.length)],
      chance: p => Math.random() < p,
      clamp, lerp: (a, b, k) => a + (b - a) * k,
      dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
      hit: (a, b) => Math.hypot(a.x - b.x, a.y - b.y) < (a.r || 0) + (b.r || 0),
      overlap: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
      // Zeichen-Helfer
      // Kein Neon-Leuchten: ruhiges, flaches Design
      glow() { ctx.shadowBlur = 0; },
      noGlow() { ctx.shadowBlur = 0; },
      circle(x, y, r, color, glow = 0) {
        if (glow) g.glow(color, glow);
        ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); ctx.fill();
        if (glow) g.noGlow();
      },
      ringStroke(x, y, r, color, w = 2, glow = 0) {
        if (glow) g.glow(color, glow);
        ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); ctx.stroke();
        if (glow) g.noGlow();
      },
      rect(x, y, w, h, color, glow = 0, radius = 0) {
        if (glow) g.glow(color, glow);
        ctx.fillStyle = color;
        if (radius) { ctx.beginPath(); ctx.roundRect(x, y, w, h, radius); ctx.fill(); } else ctx.fillRect(x, y, w, h);
        if (glow) g.noGlow();
      },
      line(x1, y1, x2, y2, color, w = 2, glow = 0) {
        if (glow) g.glow(color, glow);
        ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        if (glow) g.noGlow();
      },
      poly(points, color, glow = 0, stroke = false, w = 2) {
        if (glow) g.glow(color, glow);
        ctx.beginPath(); points.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath();
        if (stroke) { ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke(); } else { ctx.fillStyle = color; ctx.fill(); }
        if (glow) g.noGlow();
      },
      text(str, x, y, { size = 16, color = '#fff', align = 'center', weight = 700, glow = 0, base = 'middle' } = {}) {
        ctx.font = `${weight} ${size}px "Space Grotesk", system-ui, sans-serif`;
        ctx.textAlign = align; ctx.textBaseline = base;
        if (glow) g.glow(color, glow);
        ctx.fillStyle = color; ctx.fillText(str, x, y);
        if (glow) g.noGlow();
      },
      emoji(ch, x, y, size = 28) {
        ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(ch, x, y);
      },
      /** Neon-Raster als Hintergrund */
      grid(color = 'rgba(139,92,246,.12)', size = 40, offX = 0, offY = 0) {
        ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.beginPath();
        for (let x = ((offX % size) + size) % size; x < W; x += size) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
        for (let y = ((offY % size) + size) % size; y < H; y += size) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
        ctx.stroke();
      },
      /** Sternenfeld, das sich mit `speed` nach unten bewegt */
      stars(n = 80) {
        const list = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, z: Math.random() * 0.9 + 0.1 }));
        return {
          update(dt, speed = 60, dx = 0) { for (const s of list) { s.y += speed * s.z * dt; s.x += dx * s.z * dt; if (s.y > H) { s.y -= H; s.x = Math.random() * W; } if (s.x < 0) s.x += W; if (s.x > W) s.x -= W; } },
          draw() { for (const s of list) { ctx.globalAlpha = s.z; ctx.fillStyle = '#c7d2fe'; ctx.fillRect(s.x, s.y, s.z * 2, s.z * 2); } ctx.globalAlpha = 1; },
        };
      },
    };

    function reset() {
      Object.assign(g, { t: 0, score: 0, level: 1, lives: def.lives ?? 3, combo: 0, comboT: 0, s: {} });
      fx.parts = []; fx.texts = []; fx.rings = [];
      def.init(g);
    }

    /* --- Overlays --- */
    const overlay = H$('overlay');
    function keysHTML() {
      return (TOUCH && def.help ? def.help : (def.controls || '')).split('|').map(x => `<span>${x.trim().replace(/\[(.+?)\]/g, '<kbd>$1</kbd>')}</span>`).join('<span>·</span>');
    }
    function showTitle() {
      state = 'title';
      overlay.innerHTML = `<div class="overlay"><div class="overlay-box">
        <div class="glyph">${def.glyph}</div><h2>${esc(def.name)}</h2><p>${esc(def.desc)}</p>
        <div class="keys">${keysHTML()}</div>
        ${best(def.id) ? `<p>${icon('trophy', 'i-sm')} Dein Rekord: <b>${best(def.id).toLocaleString('de-DE')}</b></p>` : ''}
        <div class="row"><button class="btn primary lg" data-act="start">${icon('play')} Spielen</button></div>
        ${TOUCH ? '' : '<p class="faint" style="font-size:12px">oder <kbd>Leertaste</kbd> / <kbd>Enter</kbd></p>'}</div></div>`;
    }
    function start() {
      Sound.init();
      clearTimeout(overTimer);
      reset();
      overlay.innerHTML = '';
      state = 'play';
      LS.set('arc:plays', LS.get('arc:plays', 0) + 1);
      last = performance.now();
      if (def.startBanner !== false) g.banner(def.name, 'Los geht’s!');
    }
    function pause(on) {
      if (on && state === 'play') {
        state = 'pause';
        releaseAll();
        overlay.innerHTML = `<div class="overlay"><div class="overlay-box"><h2>Pause</h2><p>Punkte: ${g.score.toLocaleString('de-DE')}</p>
          <div class="row"><button class="btn primary lg" data-act="resume">${icon('play')} Weiter</button><button class="btn lg" data-act="restart">${icon('refresh')} Neu</button></div>
          ${TOUCH ? '' : '<p class="faint" style="font-size:12px"><kbd>P</kbd> zum Fortsetzen</p>'}</div></div>`;
      } else if (!on && state === 'pause') { overlay.innerHTML = ''; state = 'play'; last = performance.now(); }
    }
    async function showOver(won) {
      state = 'over';
      const prev = best(def.id), rec = g.score > prev;
      if (rec) LS.set('arc:' + def.id, g.score);
      overlay.innerHTML = `<div class="overlay"><div class="overlay-box">
        <h2>${won ? 'Geschafft! 🎉' : 'Game Over'}</h2>
        <div class="big-score grad-text">${g.score.toLocaleString('de-DE')}</div>
        ${rec ? `<span class="chip amber record">${icon('trophy', 'i-sm')} Neuer Rekord!</span>` : `<p>Rekord: ${prev.toLocaleString('de-DE')}</p>`}
        <p class="faint">Level ${g.level} erreicht</p>
        <div class="board" data-h="board"></div>
        <div class="row"><button class="btn primary lg" data-act="restart">${icon('refresh')} Nochmal</button><a class="btn lg" href="#arcade">Alle Spiele</a></div>
        ${TOUCH ? '' : '<p class="faint" style="font-size:12px"><kbd>Enter</kbd> für neue Runde</p>'}</div></div>`;
      if (Store.online && ME.name && g.score > 0) {
        try { classBoard[def.id] = await Store.api('POST', 'scores', { game: def.id, uid: ME.uid, name: ME.name, score: g.score }); } catch { /* egal */ }
      }
      const list = classBoard[def.id] || [];
      const board = H$('board');
      if (board && list.length) board.innerHTML = '<div style="background:none;justify-content:center"><b>Klassen-Bestenliste</b></div>' +
        list.slice(0, 5).map((e, i) => `<div class="${e.uid === ME.uid ? 'me' : ''}"><span>${i + 1}.</span><span>${esc(e.name)}</span><b>${e.score.toLocaleString('de-DE')}</b></div>`).join('');
      else if (board && Store.online && !ME.name) board.innerHTML = '<div style="background:none;justify-content:center" class="faint">Leg im Chat einen Namen fest, um in die Bestenliste zu kommen.</div>';
    }

    /* --- HUD --- */
    function hud() {
      pad.classList.toggle('idle', state !== 'play');
      const lives = def.lives === 0 ? '' : '❤'.repeat(Math.max(0, g.lives));
      const vals = { score: g.score.toLocaleString('de-DE'), level: g.level, lives, combo: g.mult };
      for (const [k, v] of Object.entries(vals)) if (hudCache[k] !== v) { hudCache[k] = v; const el = H$(k); if (el) el.textContent = v; }
      H$('comboWrap').classList.toggle('hidden', g.mult < 2);
      H$('livesWrap').classList.toggle('hidden', !lives);
      H$('levelWrap').classList.toggle('hidden', def.noLevel === true);
      H$('lives').style.color = '#f43f5e';
    }

    /* --- Schleife --- */
    function frame(ts) {
      raf = requestAnimationFrame(frame);
      const dt = Math.min(1 / 30, (ts - last) / 1000);
      last = ts;
      const running = state === 'play' || state === 'ending';
      if (running && !document.body.classList.contains('panicking')) {
        if (state === 'play') {
          g.t += dt;
          if (g.comboT > 0 && (g.comboT -= dt) <= 0) g.combo = 0;
          def.update(g, dt);
        }
        fx.update(dt);
      } else if (state === 'over') fx.update(dt);
      if (pressed.has('p')) pause(state === 'play');
      if ((pressed.has('space') || pressed.has('enter')) && (state === 'title' || state === 'over')) start();

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = def.bg || '#05060b';
      ctx.fillRect(0, 0, W, H);
      const [ox, oy] = fx.offset();
      ctx.translate(ox, oy);
      ctx.globalAlpha = 1; ctx.shadowBlur = 0;
      try { def.draw(g, ctx); } catch (e) { console.error(e); }
      ctx.globalAlpha = 1; ctx.shadowBlur = 0;
      fx.draw(ctx, W, H);
      hud();
      pressed.clear();
      ptr.pressed = ptr.released = false;
    }

    /* --- Ereignisse --- */
    const onKey = down => e => {
      if (e.target.closest?.('input, textarea, dialog')) return;
      const alias = KEYMAP[e.code];
      if (down && !def.keepPtr && (alias === 'left' || alias === 'right' || alias === 'up' || alias === 'down')) ptr.active = false;
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
      for (const k of [alias, e.code]) {
        if (!k) continue;
        if (down) { if (!held.has(k)) pressed.add(k); held.add(k); } else held.delete(k);
      }
    };
    const kd = onKey(true), ku = onKey(false);
    const toLocal = e => {
      const r = canvas.getBoundingClientRect();
      if (TOUCH && effRot()) {
        const [lx, ly] = unrot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
        ptr.x = (lx + canvas.offsetWidth / 2) * W / canvas.offsetWidth;
        ptr.y = (ly + canvas.offsetHeight / 2) * H / canvas.offsetHeight;
      } else {
        ptr.x = (e.clientX - r.left) * W / r.width;
        ptr.y = (e.clientY - r.top) * H / r.height;
      }
    };
    canvas.addEventListener('pointermove', e => { toLocal(e); ptr.active = true; });
    canvas.addEventListener('pointerdown', e => {
      toLocal(e); ptr.active = true; ptr.down = true; ptr.pressed = true;
      canvas.setPointerCapture?.(e.pointerId);
      if (state === 'title' || state === 'over') return;
    });
    const up = () => { if (ptr.down) ptr.released = true; ptr.down = false; };
    canvas.addEventListener('pointerup', up);
    canvas.addEventListener('pointercancel', up);
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    /* Touch-Pad: mehrere Finger gleichzeitig, Gleiten zwischen Tasten, sauberes Loslassen */
    const padPtr = new Map(), keyCount = new Map();
    const keyEl = k => pad.querySelector(`[data-k="${k}"]`);
    const keyDown = k => {
      if (!def.keepPtr && (k === 'left' || k === 'right' || k === 'up' || k === 'down')) ptr.active = false;
      const n = (keyCount.get(k) || 0) + 1; keyCount.set(k, n);
      if (n === 1) { if (!held.has(k)) pressed.add(k); held.add(k); keyEl(k)?.classList.add('down'); }
    };
    const keyUp = k => {
      const n = (keyCount.get(k) || 0) - 1;
      if (n > 0) { keyCount.set(k, n); return; }
      keyCount.delete(k); held.delete(k); keyEl(k)?.classList.remove('down');
    };
    const setKey = (id, k) => {
      const old = padPtr.get(id);
      if (old === k) return;
      if (old) keyUp(old);
      if (k) { keyDown(k); padPtr.set(id, k); } else padPtr.delete(id);
    };
    const keyAt = e => document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-k]')?.dataset.k || null;
    const sticksDown = new Map();
    const setStick = (name, x, y, on) => {
      const st = g.stick[name]; if (!st) return;
      st.x = x; st.y = y; st.on = on;
      if (on && !def.keepPtr) ptr.active = false;
      const el = pad.querySelector(`[data-stick="${name}"]`); if (!el) return;
      el.classList.toggle('on', on);
      const R = el.getBoundingClientRect().width * 0.34;
      el.firstElementChild.style.transform = `translate(${x * R}px, ${y * R}px)`;
    };
    const stickMove = (e, el) => {
      const r = el.getBoundingClientRect(), R = r.width * 0.34; if (!R) return;
      const [dx, dy] = unrot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
      const d = Math.hypot(dx, dy), k = d > R ? R / d : 1;
      let x = dx * k / R, y = dy * k / R;
      if (Math.hypot(x, y) < 0.12) { x = 0; y = 0; }
      setStick(el.dataset.stick, x, y, true);
    };
    const releaseAll = () => {
      for (const id of [...padPtr.keys()]) setKey(id, null);
      for (const [id, el] of [...sticksDown]) { sticksDown.delete(id); setStick(el.dataset.stick, 0, 0, false); }
    };
    pad.addEventListener('pointerdown', e => {
      const sEl = e.target.closest?.('[data-stick]');
      if (sEl) { e.preventDefault(); sticksDown.set(e.pointerId, sEl); stickMove(e, sEl); return; }
      const k = keyAt(e); if (!k) return;
      e.preventDefault(); setKey(e.pointerId, k); navigator.vibrate?.(8);
    });
    pad.addEventListener('pointermove', e => {
      if (padPtr.has(e.pointerId)) setKey(e.pointerId, keyAt(e));
      const el = sticksDown.get(e.pointerId); if (el) stickMove(e, el);
    });
    const padRelease = e => {
      setKey(e.pointerId, null);
      const el = sticksDown.get(e.pointerId);
      if (el) { sticksDown.delete(e.pointerId); setStick(el.dataset.stick, 0, 0, false); }
    };
    for (const ev of ['pointerup', 'pointercancel']) pad.addEventListener(ev, padRelease);
    pad.addEventListener('contextmenu', e => e.preventDefault());
    stage.addEventListener('click', e => {
      const a = e.target.closest('[data-act]'); if (!a) return;
      const act = a.dataset.act;
      if (act === 'start' || act === 'restart') start();
      else if (act === 'exit') location.hash = 'arcade';
      else if (act === 'rot') { rot = rot === 0 ? 90 : rot === 90 ? -90 : 0; LS.set('arcRot', rot); fit(); }
      else if (act === 'resume') pause(false);
      else if (act === 'pause') pause(state === 'play');
      else if (act === 'sound') {
        const open = $('.vol-pop', stage);
        if (open) return open.remove();
        stage.insertAdjacentHTML('beforeend', `<div class="vol-pop">${volumeControl()}</div>`);
        bindVolume($('.vol-pop', stage));
      }
    });
    const onBlur = () => pause(true);
    const onVis = () => { if (document.hidden) pause(true); };
    const onPanic = on => { if (on) pause(true); };
    addEventListener('keydown', kd);
    addEventListener('keyup', ku);
    addEventListener('resize', fit);
    let ro = null, wake = null;
    const noGesture = e => e.preventDefault();
    const onOrient = () => setTimeout(fit, 250);
    addEventListener('orientationchange', onOrient);
    if (TOUCH) {
      document.addEventListener('gesturestart', noGesture);
      if ('ResizeObserver' in window) { ro = new ResizeObserver(() => fit()); ro.observe(host); }
      try { navigator.wakeLock?.request('screen').then(l => { wake = l; }).catch(() => {}); } catch { /* egal */ }
    }
    addEventListener('blur', onBlur);
    document.addEventListener('visibilitychange', onVis);
    Bus.on('panic', onPanic);

    reset();
    showTitle();
    raf = requestAnimationFrame(frame);

    active = {
      def,
      stop() {
        cancelAnimationFrame(raf);
        ro?.disconnect();
        releaseAll();
        try { wake?.release?.(); } catch { /* egal */ }
        document.removeEventListener('gesturestart', noGesture);
        removeEventListener('orientationchange', onOrient);
        if (TOUCH) {
          if (panicBtn) { document.body.appendChild(panicBtn); panicBtn.style.left = ''; panicBtn.style.top = ''; }
          document.body.classList.remove('arc-lock');
          host.classList.remove('arc-full');
          if (host.parentNode === document.body) host.remove();
        }
        clearTimeout(overTimer);
        removeEventListener('keydown', kd);
        removeEventListener('keyup', ku);
        removeEventListener('resize', fit);
        removeEventListener('blur', onBlur);
        document.removeEventListener('visibilitychange', onVis);
        Bus.handlers.panic = (Bus.handlers.panic || []).filter(f => f !== onPanic);
      },
    };
  }

  function stop() { active?.stop(); active = null; }

  /** Lautstärke-Regler (im Spiel und in den Einstellungen) */
  function volumeControl() {
    const v = Prefs.volume;
    return `<div class="vol"><button type="button" class="btn ghost icon sm" data-vmute title="Stumm">${icon(Prefs.volumeIcon(v))}</button>
      <input class="range" type="range" min="0" max="100" step="5" value="${v}" style="--p:${v}%" aria-label="Lautstärke">
      <b class="mono">${v}%</b></div>`;
  }
  let lastVolume = 70, previewT = 0;
  function bindVolume(root) {
    const r = $('.range', root), out = $('b', root), mute = $('[data-vmute]', root);
    const show = v => { r.value = v; r.style.setProperty('--p', v + '%'); out.textContent = v + '%'; mute.innerHTML = icon(Prefs.volumeIcon(v)); };
    r.addEventListener('input', () => {
      Prefs.setVolume(+r.value); show(Prefs.volume);
      const now = Date.now(); if (now - previewT > 120) { previewT = now; Sound.init(); sfx.blip(); }
    });
    mute.addEventListener('click', () => {
      if (Prefs.volume > 0) { lastVolume = Prefs.volume; Prefs.setVolume(0); } else { Prefs.setVolume(lastVolume || 70); Sound.init(); sfx.coin(); }
      show(Prefs.volume);
    });
  }
  Bus.on('volume', v => {
    if (Sound.master) Sound.master.gain.setTargetAtTime(Sound.gainFor(v), Sound.ctx.currentTime, 0.02);
    $$('[data-act="sound"]').forEach(b => { b.innerHTML = icon(Prefs.volumeIcon(v)); });
  });

  return {
    define: def => games.push(def),
    games, play, stop, best, stats, loadBoards, volumeControl, bindVolume,
    classBest: id => (classBoard[id] || [])[0] || null,
    get active() { return active; },
  };
})();

</script>
  <script>/* js/arcade/pack-1.js */
'use strict';
/* ==========================================================
   Arcade – Paket 1
   Neon-Schlange · Blockbrecher · Neon-Arena · Sternenjäger · Neon-Sprinter
   ========================================================== */
(() => {
  const C = { cyan: '#22d3ee', violet: '#8b5cf6', pink: '#f472b6', green: '#34d399', amber: '#fbbf24', red: '#f43f5e', white: '#f8fafc', blue: '#60a5fa' };

  /* ======================= 1. Neon-Schlange ======================= */
  const SNAKE_POWER = {
    gold: { color: C.amber, label: '★' },
    slow: { color: C.blue, label: '⏱', name: 'Zeitlupe' },
    ghost: { color: C.violet, label: '◌', name: 'Geist' },
    x2: { color: C.pink, label: '×2', name: 'Doppelte Punkte' },
  };
  function snakeFree(s) {
    for (let k = 0; k < 500; k++) {
      const x = Math.floor(Math.random() * s.cols), y = Math.floor(Math.random() * s.rows);
      const busy = s.snake.some(p => p.x === x && p.y === y) || s.walls.some(p => p.x === x && p.y === y) || s.items.some(p => p.x === x && p.y === y);
      if (!busy) return { x, y };
    }
    return { x: 0, y: 0 };
  }
  Arcade.define({
    id: 'snake', name: 'Neon-Schlange', cat: 'Geschick', glyph: '🐍', colors: [C.green, C.cyan],
    desc: 'Friss Energie, wachse und schnapp dir Power-ups – aber beiß dich nicht.',
    controls: '[←][↑][→][↓] oder [WASD] | Wischen auf dem Handy', touch: ['left', 'right', 'up', 'down'],
    lives: 1, comboTime: 4,
    init(g) {
      const s = g.s;
      Object.assign(s, { S: 25, cols: 32, rows: 20, snake: [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }], dir: { x: 1, y: 0 }, queue: [], acc: 0,
        speed: 0.115, eaten: 0, walls: [], items: [], power: {}, grow: 0, swipe: null });
      s.items.push({ ...snakeFree(s), type: 'food' });
    },
    update(g, dt) {
      const s = g.s;
      const want = (x, y) => {
        const last = s.queue[s.queue.length - 1] || s.dir;
        if ((x !== -last.x || y !== -last.y) && (x !== last.x || y !== last.y) && s.queue.length < 3) s.queue.push({ x, y });
      };
      if (g.pressed('left')) want(-1, 0); if (g.pressed('right')) want(1, 0);
      if (g.pressed('up')) want(0, -1); if (g.pressed('down')) want(0, 1);
      if (g.ptr.pressed) s.swipe = { x: g.ptr.x, y: g.ptr.y };
      if (g.ptr.down && s.swipe) {
        const dx = g.ptr.x - s.swipe.x, dy = g.ptr.y - s.swipe.y;
        if (Math.hypot(dx, dy) > 30) { Math.abs(dx) > Math.abs(dy) ? want(Math.sign(dx), 0) : want(0, Math.sign(dy)); s.swipe = { x: g.ptr.x, y: g.ptr.y }; }
      }
      for (const k in s.power) if ((s.power[k] -= dt) <= 0) delete s.power[k];
      s.items = s.items.filter(it => it.ttl == null || (it.ttl -= dt) > 0);
      if (!s.items.some(i => i.type === 'food')) s.items.push({ ...snakeFree(s), type: 'food' });

      const step = s.speed * (s.power.slow ? 1.7 : 1);
      s.acc += dt;
      while (s.acc >= step) {
        s.acc -= step;
        s.dir = s.queue.shift() || s.dir;
        const head = { x: s.snake[0].x + s.dir.x, y: s.snake[0].y + s.dir.y };
        const ghost = !!s.power.ghost;
        if (head.x < 0 || head.y < 0 || head.x >= s.cols || head.y >= s.rows) {
          if (!ghost) return this.die(g);
          head.x = (head.x + s.cols) % s.cols; head.y = (head.y + s.rows) % s.rows;
        }
        if (!ghost && (s.snake.slice(0, -1).some(p => p.x === head.x && p.y === head.y) || s.walls.some(w => w.x === head.x && w.y === head.y))) return this.die(g);
        s.snake.unshift(head);
        if (s.grow > 0) s.grow--; else {
          const tail = s.snake.pop();
          g.fx.trail(tail.x * s.S + s.S / 2, tail.y * s.S + s.S / 2, C.green, 4, 0.4);
        }
        const idx = s.items.findIndex(i => i.x === head.x && i.y === head.y);
        if (idx >= 0) this.eat(g, s.items.splice(idx, 1)[0]);
      }
    },
    eat(g, it) {
      const s = g.s, px = it.x * s.S + s.S / 2, py = it.y * s.S + s.S / 2;
      const mul = s.power.x2 ? 2 : 1;
      if (it.type === 'food') {
        g.bump(); g.add(10 * mul, px, py, C.cyan); s.grow += 2; s.eaten++; g.sfx.coin();
        g.fx.burst(px, py, C.cyan, 18, 200);
        if (g.chance(0.18)) s.items.push({ ...snakeFree(s), type: 'gold', ttl: 6 });
        if (g.chance(0.14)) s.items.push({ ...snakeFree(s), type: g.pick(['slow', 'ghost', 'x2']), ttl: 8 });
        if (s.eaten % 8 === 0) {
          s.speed = Math.max(0.055, s.speed * 0.9);
          g.nextLevel('Schneller – und neue Hindernisse!');
          const len = g.rndi(3, 6), horiz = g.chance(0.5);
          for (let tries = 0; tries < 40; tries++) {
            const st = snakeFree(s), cells = Array.from({ length: len }, (_, k) => ({ x: st.x + (horiz ? k : 0), y: st.y + (horiz ? 0 : k) }));
            const h = s.snake[0];
            if (cells.every(c => c.x < s.cols && c.y < s.rows && Math.abs(c.x - h.x) + Math.abs(c.y - h.y) > 5 && !s.snake.some(p => p.x === c.x && p.y === c.y) && !s.items.some(p => p.x === c.x && p.y === c.y))) { s.walls.push(...cells); break; }
          }
        }
      } else if (it.type === 'gold') {
        g.bump(); g.add(50 * mul, px, py, C.amber); s.grow += 3; g.sfx.power(); g.fx.burst(px, py, C.amber, 30, 280); g.fx.ring(px, py, C.amber, 60);
      } else {
        s.power[it.type] = 7; g.sfx.power(); g.fx.ring(px, py, SNAKE_POWER[it.type].color, 70);
        g.fx.text(px, py - 10, SNAKE_POWER[it.type].name, SNAKE_POWER[it.type].color, 18);
      }
    },
    die(g) {
      const s = g.s, h = s.snake[0];
      g.fx.burst(h.x * s.S + s.S / 2, h.y * s.S + s.S / 2, C.green, 50, 350, 4, 1);
      s.snake.forEach((p, i) => g.fx.burst(p.x * s.S + s.S / 2, p.y * s.S + s.S / 2, C.green, 3, 120 + i * 4));
      s.dead = true;
      g.end();
    },
    draw(g, c) {
      const s = g.s, S = s.S, t = performance.now() / 1000;
      g.grid('rgba(52,211,153,.06)', S);
      for (const w of s.walls) g.rect(w.x * S + 2, w.y * S + 2, S - 4, S - 4, C.red, 12, 5);
      for (const it of s.items) {
        const x = it.x * S + S / 2, y = it.y * S + S / 2, pulse = 1 + Math.sin(t * 6) * 0.12;
        if (it.ttl != null && it.ttl < 2 && Math.floor(t * 8) % 2) continue;
        if (it.type === 'food') g.circle(x, y, 7 * pulse, C.cyan, 18);
        else { const p = SNAKE_POWER[it.type]; g.circle(x, y, 11 * pulse, p.color, 20); g.text(p.label, x, y + 1, { size: 12, color: '#05060b' }); }
      }
      if (s.dead) return;
      const ghost = !!s.power.ghost;
      c.globalAlpha = ghost ? 0.5 + Math.sin(t * 10) * 0.2 : 1;
      s.snake.forEach((p, i) => {
        const k = i / s.snake.length, pad = i === 0 ? 1 : 2 + k * 3;

  const DUEL_POWER = { big: [C.green, 'Großer Schläger'], shrink: [C.red, 'Gegner schrumpft'], multi: [C.pink, 'Multiball'], fast: [C.amber, 'Turbo'] };

        const hitPaddle = (px, py, ph, side) => {

        if (b.vx < 0 && b.x - b.r < 34 && b.x > 14 && Math.abs(b.y - s.py) < s.ph[0] / 2 + b.r) { b.x = 34 + b.r; hitPaddle(24, s.py, s.ph[0], 'me'); }
        if (b.vx > 0 && b.x + b.r > W - 34 && b.x < W - 14 && Math.abs(b.y - s.ay) < s.ph[1] / 2 + b.r) { b.x = W - 34 - b.r; hitPaddle(W - 24, s.ay, s.ph[1], 'ai'); }
        for (const p of s.pows) if (!p.dead && g.dist(b.x, b.y, p.x, p.y) < p.r + b.r) {
          p.dead = true; g.sfx.power(); g.fx.ring(p.x, p.y, DUEL_POWER[p.type][0], 70);
          const who = b.last, other = who === 'me' ? 'ai' : 'me';
          g.fx.text(p.x, p.y - 22, (who === 'me' ? '' : 'KI: ') + DUEL_POWER[p.type][1], DUEL_POWER[p.type][0]);
          if (p.type === 'multi') s.balls.push({ ...b, vy: -b.vy, wait: 0 });
          else if (p.type === 'shrink') s.eff[other].shrink = 8;
          else s.eff[who][p.type] = 8;
        }
        g.fx.trail(b.x, b.y, b.last === 'me' ? C.cyan : C.red, 4, 0.2);
        if (b.x < -20) { b.out = true; g.fx.flash(C.red, 0.2); if (s.balls.filter(x => !x.out).length === 0 && g.hurt()) return; }
        if (b.x > W + 20) {
          b.out = true; s.goals++; g.bump(); g.add(100 + s.rally * 10, W - 60, b.y, C.cyan); g.fx.flash(C.cyan, 0.15); g.sfx.coin();
          if (s.goals % 5 === 0) g.nextLevel('Die KI wird stärker');
        }
      }
      s.balls = s.balls.filter(b => !b.out);
      s.pows = s.pows.filter(p => !p.dead && p.t < 10);
      if (!s.balls.length) { s.rally = 0; this.serve(g, g.chance(0.5) ? 1 : -1); }
    },
    draw(g, c) {
      const s = g.s, W = g.W, H = g.H, t = performance.now() / 1000;
      g.grid('rgba(34,211,238,.05)', 40);
      c.setLineDash([10, 12]); g.line(W / 2, 0, W / 2, H, 'rgba(255,255,255,.15)', 2); c.setLineDash([]);
      g.ringStroke(W / 2, H / 2, 70, 'rgba(255,255,255,.08)', 2);

      g.rect(14, s.py - s.ph[0] / 2, 14, s.ph[0], C.cyan, 22, 7);

  });

  Arcade.define({

    update(g, dt) {

        if (pattern === 1) { s.patT = 0.9 - Math.min(0.4, lv * 0.03); const n = 18 + lv, o = g.rnd(0, 1); for (let k = 0; k < n; k++) this.fire(g, em.x, em.y, o + k * Math.PI * 2 / n, speed * 0.9, C.violet); }
        if (pattern === 2) { s.patT = 0.55; const a = Math.atan2(p.y - em.y, p.x - em.x); for (let k = -3; k <= 3; k++) this.fire(g, em.x, em.y, a + k * 0.16, speed * 1.3, C.amber, 5); }
        if (pattern === 3) { s.patT = 0.07; const a = em.t * 2; for (let k = 0; k < 4; k++) this.fire(g, em.x, em.y, a * (k % 2 ? -1 : 1) + k * Math.PI / 2, speed * 0.85, k % 2 ? C.cyan : C.pink, 5); }
        if (pattern === 4) { s.patT = 0.12; this.fire(g, g.rnd(0, W), -10, Math.PI / 2 + g.rnd(-0.2, 0.2), speed * 1.1, C.blue, 5); if (g.chance(0.3)) { const a = Math.atan2(p.y - em.y, p.x - em.x); this.fire(g, em.x, em.y, a, speed * 1.6, C.red, 7); } }
      }
      for (const b of s.bullets) {
        b.x += b.vx * dt; b.y += b.vy * dt;
        const d = g.dist(b.x, b.y, p.x, p.y);
        if (d < b.r + p.r && p.inv <= 0) {

      }

  /* ======================= 13. Klingen-Schnitt ======================= */
  const SLICE_KINDS = [
    { sides: 3, color: C.pink, pts: 10 }, { sides: 4, color: C.cyan, pts: 10 }, { sides: 5, color: C.green, pts: 15 },
    { sides: 6, color: C.violet, pts: 15 }, { sides: 0, color: C.amber, pts: 20 },
  ];
  function segCircle(x1, y1, x2, y2, cx, cy, r) {
    const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy || 1;
    const t = clamp(((cx - x1) * dx + (cy - y1) * dy) / l2, 0, 1);
    return Math.hypot(x1 + t * dx - cx, y1 + t * dy - cy) < r;
  }
  Arcade.define({
    id: 'slice', name: 'Klingen-Schnitt', cat: 'Action', glyph: '🗡️', colors: [C.green, C.pink], h: 540,
    desc: 'Zerschneide die fliegenden Formen mit schnellen Wischbewegungen. Finger weg von Bomben!',
    controls: 'Maus schnell bewegen / Finger wischen | mehrere auf einmal = Kombo',
    lives: 3, comboTime: 1.2,
    init(g) {
      Object.assign(g.s, { items: [], halves: [], trail: [], spawnT: 1, sliced: 0, slow: 0, lastX: null, lastY: null, swipe: 0, swipeT: 0 });
    },
    throwWave(g) {
      const s = g.s, lv = g.level, n = g.rndi(1, Math.min(6, 2 + Math.floor(lv / 2)));
      for (let k = 0; k < n; k++) {
        const x = g.rnd(120, g.W - 120), vx = (g.W / 2 - x) * g.rnd(0.3, 0.8) + g.rnd(-60, 60);
        const r = g.rnd(0, 1);
        let item;
        if (r < Math.min(0.22, 0.08 + lv * 0.02)) item = { bomb: true, r: 24 };
        else if (r < 0.27) item = { gold: true, r: 18 };
        else if (r < 0.3) item = { ice: true, r: 22 };
        else item = { kind: g.pick(SLICE_KINDS), r: g.rnd(24, 34) };
        s.items.push({ ...item, x, y: g.H + 40, vx, vy: -g.rnd(640, 780), rot: g.rnd(0, 6), vr: g.rnd(-4, 4) });
      }
      s.spawnT = Math.max(0.8, 2.1 - lv * 0.12);
    },
    update(g, dt) {
      const s = g.s, slowK = s.slow > 0 ? 0.45 : 1, edt = dt * slowK;
      s.slow = Math.max(0, s.slow - dt);
      if ((s.spawnT -= edt) <= 0) this.throwWave(g);
      // Klinge
      const px = g.ptr.x, py = g.ptr.y;
      const speed = s.lastX == null ? 0 : g.dist(px, py, s.lastX, s.lastY) / dt;
      const active = g.ptr.active && speed > 380;
      if (active) s.trail.push({ x: px, y: py, t: 0.15 });
      for (const t of s.trail) t.t -= dt;
      s.trail = s.trail.filter(t => t.t > 0);
      if ((s.swipeT -= dt) <= 0) {
        if (s.swipe >= 3) { const b = s.swipe * 15; g.add(b, px, py - 30, C.amber); g.fx.text(px, py - 56, `${s.swipe}er-Kombo!`, C.amber, 22); g.sfx.power(); }
        s.swipe = 0;
      }
      for (const it of s.items) {
        it.vy += 820 * edt; it.x += it.vx * edt; it.y += it.vy * edt; it.rot += it.vr * edt;
        if (active && !it.cut && segCircle(s.lastX, s.lastY, px, py, it.x, it.y, it.r)) {
          it.cut = true;
          const ang = Math.atan2(py - s.lastY, px - s.lastX);
          if (it.bomb) {
            g.fx.burst(it.x, it.y, C.red, 70, 450, 5, 1); g.fx.flash('#fff', 0.5); g.sfx.boom();
            s.items.forEach(o => o.cut = true);
            if (g.hurt()) return;
            break;
          }
          s.swipe++; s.swipeT = 0.25; s.sliced++;
          g.bump(); g.sfx.whoosh(); g.sfx.pop();
          const col = it.gold ? C.amber : it.ice ? C.blue : it.kind.color;
          g.add(it.gold ? 60 : it.ice ? 20 : it.kind.pts, it.x, it.y - 20, col);
          g.fx.burst(it.x, it.y, col, 22, 280, 3, 0.6);
          if (it.ice) { s.slow = 4; g.fx.flash(C.blue, 0.2); g.fx.text(it.x, it.y - 46, 'Zeitlupe', C.blue); }
          for (const side of [-1, 1]) s.halves.push({ x: it.x, y: it.y, vx: it.vx + Math.cos(ang + side * Math.PI / 2) * 160, vy: it.vy * 0.4 + Math.sin(ang + side * Math.PI / 2) * 160, rot: ang, vr: side * 5, side, it, life: 1.5 });
          if (s.sliced % 25 === 0) g.nextLevel('Mehr Formen!');
        }
        if (!it.cut && it.y > g.H + 60 && it.vy > 0) {
          it.cut = true;
          if (!it.bomb && !it.ice && !it.gold) { g.fx.text(it.x, g.H - 30, 'Verpasst', C.red); if (g.hurt()) return; }
        }

      for (const h of s.halves) { h.vy += 820 * edt; h.x += h.vx * edt; h.y += h.vy * edt; h.rot += h.vr * edt; h.life -= dt; }
      s.halves = s.halves.filter(h => h.life > 0 && h.y < g.H + 80);
      s.lastX = px; s.lastY = py;
    },
    shape(g, c, it, clipSide) {
      const r = it.r;
      if (it.bomb) { g.circle(0, 0, r, '#1a1b26'); g.ringStroke(0, 0, r, C.red, 3, 18); g.text('✸', 0, 1, { size: 20, color: C.red }); return; }
      const col = it.gold ? C.amber : it.ice ? C.blue : it.kind.color;
      if (clipSide) { c.beginPath(); c.rect(clipSide < 0 ? -r - 4 : 0, -r - 4, r + 4, r * 2 + 8); c.clip(); }
      if (it.gold) { g.poly(Array.from({ length: 10 }, (_, k) => { const rr = k % 2 ? r * 0.45 : r, q = k * Math.PI / 5 - Math.PI / 2; return [Math.cos(q) * rr, Math.sin(q) * rr]; }), col, 18); return; }
      if (it.ice) { g.poly([[0, -r], [r * 0.85, 0], [0, r], [-r * 0.85, 0]], col, 18); g.poly([[0, -r * 0.5], [r * 0.4, 0], [0, r * 0.5], [-r * 0.4, 0]], '#e0f2fe'); return; }
      const n = it.kind.sides;
      if (!n) { g.circle(0, 0, r, col, 16); g.circle(0, 0, r * 0.55, 'rgba(255,255,255,.25)'); return; }
      g.poly(Array.from({ length: n }, (_, k) => [Math.cos(k * Math.PI * 2 / n) * r, Math.sin(k * Math.PI * 2 / n) * r]), col, 16);
      g.poly(Array.from({ length: n }, (_, k) => [Math.cos(k * Math.PI * 2 / n) * r * 0.5, Math.sin(k * Math.PI * 2 / n) * r * 0.5]), 'rgba(255,255,255,.22)');
    },
    draw(g, c) {
      const s = g.s;
      const bg = c.createRadialGradient(g.W / 2, g.H, 50, g.W / 2, g.H, g.W);
      bg.addColorStop(0, s.slow > 0 ? '#0c2238' : '#140c22'); bg.addColorStop(1, '#05060b');
      c.fillStyle = bg; c.fillRect(0, 0, g.W, g.H);
      for (const it of s.items) { c.save(); c.translate(it.x, it.y); c.rotate(it.rot); this.shape(g, c, it); c.restore(); }
      for (const h of s.halves) { c.save(); c.globalAlpha = Math.min(1, h.life); c.translate(h.x, h.y); c.rotate(h.rot); this.shape(g, c, h.it, h.side); c.restore(); }
      if (s.trail.length > 1) {
        c.save(); g.glow(C.cyan, 18); c.lineCap = 'round'; c.lineJoin = 'round';
        for (let i = 1; i < s.trail.length; i++) {
          const a = s.trail[i - 1], b = s.trail[i];
          c.strokeStyle = `rgba(224,251,255,${b.t / 0.15})`; c.lineWidth = 2 + (i / s.trail.length) * 6;
          c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
        }
        c.restore();
      }
      if (g.t < 3) g.text('Bewege die Maus schnell durch die Formen!', g.W / 2, g.H - 40, { size: 15, color: 'rgba(255,255,255,.6)', weight: 500 });
    },
  });

  /* ======================= 14. Neon-Reflex ======================= */
  Arcade.define({
    id: 'reflex', name: 'Neon-Reflex', cat: 'Reflex', glyph: '⚡', colors: [C.amber, C.cyan],
    desc: 'Triff die Ziele, bevor sie verschwinden. Gold = Bonus, Rot = Finger weg!',
    controls: 'Klicken / Tippen | Mitte treffen = mehr Punkte',
    lives: 3, comboTime: 1.6,
    init(g) { Object.assign(g.s, { targets: [], spawnT: 0.5, hits: 0, misses: [] }); },
    update(g, dt) {
      const s = g.s, lv = g.level;
      if ((s.spawnT -= dt) <= 0) {
        s.spawnT = Math.max(0.3, 0.95 - lv * 0.07) * g.rnd(0.7, 1.2);
        const r = g.rnd(0, 1), kind = r < 0.1 ? 'gold' : r < Math.min(0.25, 0.1 + lv * 0.025) ? 'fake' : 'normal';
        const life = (kind === 'gold' ? 1.1 : 1.9) * Math.max(0.5, 1 - lv * 0.06);
        const size = kind === 'gold' ? 20 : g.rnd(30, 44);
        const moving = lv >= 3 && g.chance(0.35);
        s.targets.push({ x: g.rnd(60, g.W - 60), y: g.rnd(80, g.H - 50), r: size, life, max: life, kind, vx: moving ? g.rnd(-120, 120) : 0, vy: moving ? g.rnd(-80, 80) : 0 });
      }
      for (const t of s.targets) {
        t.life -= dt; t.x += t.vx * dt; t.y += t.vy * dt;
        if (t.x < t.r || t.x > g.W - t.r) t.vx *= -1;
        if (t.y < 60 || t.y > g.H - t.r) t.vy *= -1;
        if (t.life <= 0 && !t.dead) {
          t.dead = true;
          if (t.kind === 'normal') { g.fx.text(t.x, t.y, 'Zu langsam', C.red); g.fx.ring(t.x, t.y, C.red, 40); if (g.hurt()) return; }
        }
      }
      if (g.ptr.pressed) {
        const hit = [...s.targets].reverse().find(t => !t.dead && g.dist(g.ptr.x, g.ptr.y, t.x, t.y) < t.r * (t.life / t.max * 0.4 + 0.6) + 4);
        if (hit) {
          hit.dead = true;
          if (hit.kind === 'fake') { g.fx.burst(hit.x, hit.y, C.red, 30, 300); if (g.hurt()) return; }
          else {
            const prec = 1 - g.dist(g.ptr.x, g.ptr.y, hit.x, hit.y) / hit.r, quick = hit.life / hit.max;
            const pts = Math.round((hit.kind === 'gold' ? 50 : 10) + prec * 10 + quick * 10);
            g.bump(); g.add(pts, hit.x, hit.y - hit.r, hit.kind === 'gold' ? C.amber : C.cyan);
            g.fx.burst(hit.x, hit.y, hit.kind === 'gold' ? C.amber : C.cyan, 20, 260, 3, 0.5); g.fx.ring(hit.x, hit.y, C.white, hit.r * 1.6);
            g.sfx.pop(); s.hits++;

            if (s.hits % 15 === 0) g.nextLevel('Schneller!');
          }
        } else { g.breakCombo(); s.misses.push({ x: g.ptr.x, y: g.ptr.y, t: 0.4 }); g.sfx.blip(); }
      }
      for (const m of s.misses) m.t -= dt;
      s.misses = s.misses.filter(m => m.t > 0);
      s.targets = s.targets.filter(t => !t.dead);
    },
    draw(g, c) {
      const s = g.s;
      g.grid('rgba(251,191,36,.05)', 50);

        const k = t.life / t.max, r = t.r * (k * 0.4 + 0.6);

        else g.circle(t.x, t.y, r * 0.22, col, 10);
        c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.arc(t.x, t.y, r + 6, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); c.stroke();
        c.globalAlpha = 1;
      }

    },
  });

  /* ======================= 15. Takt-Tipper ======================= */
  const LANE_KEYS = [['KeyD', 'left'], ['KeyF', 'down'], ['KeyJ', 'up'], ['KeyK', 'right']];
  const LANE_COL = [C.pink, C.cyan, C.green, C.amber];
  const SCALE = [261.6, 293.7, 329.6, 392, 440, 523.3, 587.3, 659.3];
  Arcade.define({
    id: 'rhythm', name: 'Takt-Tipper', cat: 'Reflex', glyph: '🎵', colors: [C.pink, C.amber], w: 600, h: 640,
    desc: 'Rhythmus-Spiel: Drück die Taste genau dann, wenn die Note die Linie erreicht.',
    controls: '[D][F][J][K] oder [←][↓][↑][→] | Tippen auf die Spuren',
    lives: 0, comboTime: 99,
    init(g) {
      Object.assign(g.s, { notes: [], beat: 0, nextBeat: 1.2, hp: 100, hitY: g.H - 110, flashes: [0, 0, 0, 0], judge: null, hits: 0, streak: 0, bar: 0 });
    },
    laneX(g, i) { return g.W / 2 + (i - 1.5) * 110; },
    update(g, dt) {
      const s = g.s, lv = g.level, bpm = 100 + lv * 8, spb = 60 / bpm, speed = 380 + lv * 30, travel = (s.hitY + 30) / speed;
      s.nextBeat -= dt;
      while (s.nextBeat <= 0) {
        s.beat++; s.nextBeat += spb / 2;
        const onBeat = s.beat % 2 === 0;
        // Musik: Bass-Schlag auf jedem Takt, betont auf der Eins
        if (onBeat) { s.bar++; this.kick(g, s.bar % 4 === 1); }
        // Noten erzeugen (erscheinen oben und erreichen die Linie nach `travel` Sekunden)
        const dens = Math.min(0.85, 0.35 + lv * 0.06);
        if ((onBeat && g.chance(dens + 0.15)) || (!onBeat && lv >= 2 && g.chance(dens * 0.45))) {
          const lane = g.rndi(0, 3);
          s.notes.push({ lane, y: -30, speed, tone: SCALE[(lane * 2 + s.bar) % SCALE.length] });
          if (lv >= 3 && g.chance(0.15)) { const l2 = (lane + 2) % 4; s.notes.push({ lane: l2, y: -30, speed, tone: SCALE[(l2 * 2 + s.bar + 2) % SCALE.length] }); }
        }
      }
      for (const n of s.notes) { n.y += n.speed * dt; }
      // Eingaben
      const lanesHit = [];
      LANE_KEYS.forEach(([code, alias], i) => { if (g.pressed(code, alias)) lanesHit.push(i); });
      if (g.ptr.pressed && g.ptr.y > g.H * 0.45) { const i = Math.round((g.ptr.x - g.W / 2) / 110 + 1.5); if (i >= 0 && i < 4) lanesHit.push(i); }
      for (const i of lanesHit) {
        s.flashes[i] = 0.15;
        const cand = s.notes.filter(n => n.lane === i && !n.done).sort((a, b) => Math.abs(a.y - s.hitY) - Math.abs(b.y - s.hitY))[0];
        const d = cand ? Math.abs(cand.y - s.hitY) : 999;
        if (d < 70) {
          cand.done = true;
          const [label, pts, col] = d < 16 ? ['PERFEKT', 100, C.amber] : d < 36 ? ['SUPER', 60, C.cyan] : ['GUT', 30, C.green];
          g.bump(); g.add(pts, this.laneX(g, i), s.hitY - 40, col);
          s.judge = { label, col, t: 0.5 }; s.hits++; s.streak++;
          s.hp = Math.min(100, s.hp + (d < 16 ? 3 : 1));
          g.sfx.note(cand.tone);
          g.fx.burst(this.laneX(g, i), s.hitY, LANE_COL[i], 16, 220, 3, 0.4); g.fx.ring(this.laneX(g, i), s.hitY, LANE_COL[i], 46, 0.3);
          if (s.hits % 40 === 0) g.nextLevel('Schnellerer Takt!');
        } else { s.hp -= 4; g.breakCombo(); s.streak = 0; }
      }
      for (const n of s.notes) if (!n.done && n.y > s.hitY + 70) {
        n.done = true; s.hp -= 10; g.breakCombo(); s.streak = 0;
        s.judge = { label: 'VERPASST', col: C.red, t: 0.5 }; g.fx.shake(4, 0.12);
      }
      s.notes = s.notes.filter(n => !n.done);
      s.flashes = s.flashes.map(f => Math.max(0, f - dt));
      if (s.judge) s.judge.t -= dt;
      if (s.hp <= 0) { s.hp = 0; g.end(); }
    },
    kick(g, accent) {
      // Kleiner Bass-Schlag (über die Engine-Effekte)
      g.sfx.note(accent ? 110 : 82);
    },
    draw(g, c) {
      const s = g.s, H = g.H, t = performance.now() / 1000;
      const pulse = Math.max(0, 1 - (s.nextBeat % 0.3) * 4);
      g.grid(`rgba(244,114,182,${0.04 + pulse * 0.04})`, 40, 0, (t * 60) % 40);
      for (let i = 0; i < 4; i++) {
        const x = this.laneX(g, i);
        g.rect(x - 48, 0, 96, H, `rgba(255,255,255,${0.025 + s.flashes[i] * 0.6})`);

        let mx = (g.down('right') ? 1 : 0) - (g.down('left') ? 1 : 0), my = (g.down('down') ? 1 : 0) - (g.down('up') ? 1 : 0);
        const sm = g.stick.move; if (sm.on && (sm.x || sm.y)) { mx = sm.x; my = sm.y; }
        if (!mx && !my && g.ptr.down) { const dx = g.ptr.x - p.x, dy = g.ptr.y - p.y, d = Math.hypot(dx, dy); if (d > 8) { mx = dx / d; my = dy / d; } }
        const l = Math.hypot(mx, my), acc = p.power === 'speed' ? 620 : 420;
        if (l) { const k = Math.min(1, l) / l; p.vx += mx * k * acc * dt; p.vy += my * k * acc * dt; }
        if (g.pressed('space', 'shift') && p.cd <= 0) {
          let dx = mx, dy = my;
          if (!l) { const sp = Math.hypot(p.vx, p.vy); if (sp > 5) { dx = p.vx / sp; dy = p.vy / sp; } else if (g.ptr.active) { dx = g.ptr.x - p.x; dy = g.ptr.y - p.y; } }
          const dl = Math.hypot(dx, dy) || 1;
          p.vx += dx / dl * 520; p.vy += dy / dl * 520; p.cd = 0.9; p.dash = 0.25; g.sfx.whoosh(); g.fx.ring(p.x, p.y, C.pink, 30, 0.3);
        }
      }
      // KI
      for (const f of s.foes) {
        if (f.fall > 0) continue;
        f.cd -= dt;
        const dc = g.dist(f.x, f.y, s.cx, s.cy);
        let tx = p.x, ty = p.y;
        if (dc > s.R * 0.78) { tx = s.cx; ty = s.cy; }
        else if (p.fall > 0) { const o = s.foes.find(x => x !== f && x.fall <= 0); if (o) { tx = o.x; ty = o.y; } else { tx = s.cx; ty = s.cy; } }
        const dx = tx - f.x, dy = ty - f.y, d = Math.hypot(dx, dy) || 1;
        f.vx += dx / d * f.acc / f.m * dt; f.vy += dy / d * f.acc / f.m * dt;
        if (f.cd <= 0 && d < 140 && dc < s.R * 0.78) { f.vx += dx / d * 420; f.vy += dy / d * 420; f.cd = g.rnd(1.6, 3) * Math.max(0.5, 1 - g.level * 0.05); f.dash = 0.25; }
      }
      // Bewegung + Reibung
      for (const o of all) {
        if (o.fall > 0) { o.fall += dt; o.x += o.vx * dt * 0.5; o.y += o.vy * dt * 0.5; continue; }
        o.dash = Math.max(0, o.dash - dt);
        const fr = Math.pow(0.35, dt); o.vx *= fr; o.vy *= fr;
        const sp = Math.hypot(o.vx, o.vy), max = o.dash > 0 ? 900 : (o === p && p.power === 'speed' ? 420 : 300);
        if (sp > max) { o.vx *= max / sp; o.vy *= max / sp; }
        o.x += o.vx * dt; o.y += o.vy * dt;
      }
      // Stöße
      for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
        const a = all[i], b = all[j];
        if (a.fall > 0 || b.fall > 0) continue;
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r;
        if (d >= min || d === 0) continue;
        const nx = dx / d, ny = dy / d, ov = (min - d) / 2;
        a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov;
        const rel = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
        if (rel <= 0) continue;
        const bounce = 1.6 + (a.dash > 0 || b.dash > 0 ? 0.9 : 0);
        const imp = bounce * rel / (1 / a.m + 1 / b.m);
        a.vx -= imp / a.m * nx; a.vy -= imp / a.m * ny; b.vx += imp / b.m * nx; b.vy += imp / b.m * ny;
        if (rel > 120) { g.sfx.bounce(); g.fx.burst(a.x + nx * a.r, a.y + ny * a.r, C.white, 8, 160, 2, 0.3); if (rel > 400) g.fx.shake(5); }
        if (a === p || b === p) { const f = a === p ? b : a; f.lastHit = 2; }
      }
      // Power-ups
      if ((s.itemT -= dt) <= 0) {
        s.itemT = g.rnd(5, 8);
        const a = g.rnd(0, Math.PI * 2), r = g.rnd(0, s.R * 0.6);
        s.items.push({ x: s.cx + Math.cos(a) * r, y: s.cy + Math.sin(a) * r, type: g.pick(Object.keys(POWERS)), life: 7 });
      }
      for (const it of s.items) {
        it.life -= dt;
        if (p.fall <= 0 && g.dist(it.x, it.y, p.x, p.y) < p.r + 12) {
          it.dead = true; g.sfx.power(); g.fx.text(p.x, p.y - 34, POWERS[it.type].label, POWERS[it.type].col, 16);
          if (it.type === 'shock') {
            g.fx.ring(p.x, p.y, C.amber, 170, 0.45); g.fx.shake(8);
            for (const f of s.foes) { const d = g.dist(f.x, f.y, p.x, p.y); if (d < 170 && f.fall <= 0) { f.vx += (f.x - p.x) / d * 700 / f.m; f.vy += (f.y - p.y) / d * 700 / f.m; f.dash = 0.3; f.lastHit = 2; } }
          } else { p.power = it.type; p.powT = 6; }
        }
      }
      s.items = s.items.filter(it => !it.dead && it.life > 0);
      // Herunterfallen
      for (const f of s.foes) {
        f.lastHit = Math.max(0, (f.lastHit || 0) - dt);
        if (f.fall <= 0 && g.dist(f.x, f.y, s.cx, s.cy) > s.R + f.r * 0.2) {
          f.fall = 0.001; g.bump(); g.add(f.m > 1 ? 250 : 100, f.x, f.y - 20, `hsl(${f.hue} 90% 60%)`); g.sfx.boom();
          g.fx.burst(f.x, f.y, `hsl(${f.hue} 90% 60%)`, 30, 250, 3, 0.6);
          if (f.lastHit > 0) g.fx.text(f.x, f.y - 44, 'Rausgeschubst!', C.pink, 15);
        }
      }
      s.foes = s.foes.filter(f => f.fall < 0.8);
      if (p.fall <= 0 && g.dist(p.x, p.y, s.cx, s.cy) > s.R + p.r * 0.2 && p.inv <= 0) { p.fall = 0.001; g.sfx.lose(); }
      else if (p.fall <= 0 && g.dist(p.x, p.y, s.cx, s.cy) > s.R - 2 && p.inv > 0) { const a = Math.atan2(p.y - s.cy, p.x - s.cx); p.x = s.cx + Math.cos(a) * (s.R - 2); p.y = s.cy + Math.sin(a) * (s.R - 2); p.vx *= -0.5; p.vy *= -0.5; }
      if (p.fall > 0.8) {
        if (g.hurt(s.cx, s.cy)) return;
        Object.assign(p, { x: s.cx, y: s.cy, vx: 0, vy: 0, fall: 0, inv: 2, power: null });
        for (const f of s.foes) if (g.dist(f.x, f.y, s.cx, s.cy) < 80) { const a = Math.atan2(f.y - s.cy, f.x - s.cx) || 1; f.x = s.cx + Math.cos(a) * 90; f.y = s.cy + Math.sin(a) * 90; }
      }
      if (!s.foes.length && p.fall <= 0) { g.add(200 * g.level, s.cx, s.cy - 60, C.amber); g.nextLevel(`${Math.min(6, 2 + g.level)} Gegner · kleinere Arena`); this.build(g); }
    },
    puck(g, c, o, col, label) {
      const k = o.fall > 0 ? Math.max(0.05, 1 - o.fall / 0.8) : 1;
      c.save(); c.translate(o.x, o.y); c.scale(k, k); c.globalAlpha = k;
      g.circle(0, 0, o.r, col, o.dash > 0 ? 28 : 16);
      g.circle(0, 0, o.r * 0.62, 'rgba(5,6,11,.55)');
      g.circle(0, 0, o.r * 0.3, col);
      if (label) g.text(label, 0, -o.r - 12, { size: 11, color: 'rgba(255,255,255,.8)' });
      c.restore();
    },
    draw(g, c) {
      const s = g.s, p = s.p, t = performance.now() / 1000;
      c.fillStyle = '#05050b'; c.fillRect(0, 0, g.W, g.H);
      const gr = c.createRadialGradient(s.cx, s.cy, 20, s.cx, s.cy, s.R);
      gr.addColorStop(0, '#1a1430'); gr.addColorStop(1, '#100c20');
      c.fillStyle = gr; c.beginPath(); c.arc(s.cx, s.cy, s.R, 0, Math.PI * 2); c.fill();
      g.ringStroke(s.cx, s.cy, s.R, C.pink, 4, 22);
      g.ringStroke(s.cx, s.cy, s.R * 0.5, 'rgba(139,92,246,.25)', 1);
      g.ringStroke(s.cx, s.cy, 24, 'rgba(139,92,246,.25)', 1);
      for (const it of s.items) {
        const P = POWERS[it.type], a = it.life < 2 ? (Math.floor(t * 8) % 2 ? 0.4 : 1) : 1;
        c.globalAlpha = a; g.rect(it.x - 12, it.y - 12, 24, 24, P.col, 18, 7); g.text(it.type === 'heavy' ? 'S' : it.type === 'speed' ? 'T' : '✦', it.x, it.y + 1, { size: 13, color: '#05060b' }); c.globalAlpha = 1;
      }
      for (const f of s.foes) this.puck(g, c, f, `hsl(${f.hue} 90% 60%)`);
      if (!(p.inv > 0 && Math.floor(t * 10) % 2)) this.puck(g, c, p, p.power ? POWERS[p.power].col : C.cyan, 'DU');
      g.rect(20, g.H - 24, 100, 6, 'rgba(255,255,255,.12)', 0, 3);
      g.rect(20, g.H - 24, 100 * (1 - p.cd / 0.9), 6, p.cd <= 0 ? C.pink : 'rgba(244,114,182,.5)', p.cd <= 0 ? 10 : 0, 3);
      g.text('Dash', 130, g.H - 20, { size: 12, color: 'rgba(255,255,255,.55)', align: 'left', weight: 600 });
      if (p.power) g.text(`${POWERS[p.power].label} ${p.powT.toFixed(1)} s`, g.W - 20, g.H - 20, { size: 13, color: POWERS[p.power].col, align: 'right' });
    },
  });
})();

  <script>/* js/panic.js */
'use strict';
/* ==========================================================
   Notfall-Knopf: schwarzer Update-Bildschirm oder eigenes Bild
   ========================================================== */
const Panic = (() => {
  const el = $('#panic'), fill = $('#panicFill'), img = $('#panicImg'), update = $('#panicUpdate');
  let timer = null, progress = 0, lastTap = 0, prevTitle = '';

  function show() {
    const mode = LS.get('panicMode', 'apple'), imgs = LS.get('panicImgs', []), sel = LS.get('panicSel', 'random');
    const useImg = mode === 'image' && imgs.length > 0;
    update.classList.toggle('hidden', useImg);
    img.classList.toggle('hidden', !useImg);
    if (useImg) img.src = sel === 'random' ? imgs[Math.floor(Math.random() * imgs.length)] : imgs[sel] || imgs[0];

    // Ladebalken wächst langsam und unregelmäßig, wird aber nie fertig
    progress = 8 + Math.random() * 22;
    fill.style.transition = 'none';
    fill.style.width = progress + '%';
    requestAnimationFrame(() => { fill.style.transition = ''; });
    clearInterval(timer);
    timer = setInterval(() => {
      if (Math.random() < 0.6) progress += (97 - progress) * (0.004 + Math.random() * 0.01);
      fill.style.width = progress.toFixed(2) + '%';
    }, 1000);

    el.classList.remove('hidden');
    document.body.classList.add('panicking');
    Bus.emit('panic', true);
    prevTitle = document.title;
    document.title = 'Softwareupdate';
    document.activeElement?.blur?.();
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) try { req.call(el)?.catch?.(() => {}); } catch {}
  }

  function hide() {
    if (el.classList.contains('hidden')) return;
    el.classList.add('hidden');
    document.body.classList.remove('panicking');
    document.title = prevTitle || 'Plyon';
    clearInterval(timer);
    if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
    Bus.emit('panic', false);
  }

  $('#panicBtn').onclick = show;
  addEventListener('keydown', e => {
    if (e.key === 'Escape' && !el.classList.contains('hidden')) { e.stopPropagation(); hide(); }
  }, true);
  // Antippen des Apple-Logos beendet den Notfall; bei eigenen Bildern geht es per Doppeltipp
  $('.panic-logo', el).addEventListener('pointerup', e => { e.stopPropagation(); hide(); });
  el.addEventListener('pointerup', () => { const t = Date.now(); if (t - lastTap < 400) hide(); lastTap = t; });
  el.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) hide(); });

  return { show, hide };
})();

</script>
  <script>/* js/app.js */
'use strict';
/* ==========================================================
   App: Navigation, Router, Start
   ========================================================== */
const NAV = [
  { id: 'home', label: 'Übersicht', short: 'Start', icon: 'home' },
  { id: 'calendar', label: 'Kalender', short: 'Kalender', icon: 'calendar' },
  { id: 'blocks', label: 'Blockplan', short: 'Blöcke', icon: 'clock' },
  { id: 'arcade', label: 'Arcade', short: 'Arcade', icon: 'gamepad' },
  { id: 'chat', label: 'Chat', short: 'Chat', icon: 'chat' },
  { id: 'settings', label: 'Einstellungen', short: 'Mehr', icon: 'settings', foot: true },
];

const App = {
  view: null,
  arg: null,
  unread: 0,

  renderNav() {
    const item = (n, cls) => `<button class="${cls} ${this.view === n.id ? 'active' : ''}" data-go="${n.id}">${icon(n.icon)}<span>${cls === 'tab' ? n.short : n.label}</span>
      ${n.id === 'chat' && this.unread ? `<span class="badge count">${this.unread}</span>` : ''}</button>`;
    $('#sidebar').innerHTML = `
      <div class="brand"><div class="brand-mark">P</div>
        <div><div class="brand-name">Plyon</div><div class="brand-sub">${esc(Data.cfg.className || '')}</div></div></div>
      <div class="nav-label">Menü</div>
      ${NAV.filter(n => !n.foot).map(n => item(n, 'nav-item')).join('')}
      <div class="sidebar-foot">
        <div class="user-chip">${UI.avatar(ME.name, 'sm')}<b>${esc(ME.name)}</b><button class="btn ghost icon sm" data-theme-toggle title="${Prefs.dark ? 'Helles Design' : 'Dunkles Design'}" aria-label="Design wechseln">${icon(Prefs.dark ? 'sun' : 'moon')}</button><button class="btn ghost icon sm" data-logout title="Abmelden" aria-label="Abmelden">${icon('arrowRight')}</button></div>
        ${NAV.filter(n => n.foot).map(n => item(n, 'nav-item')).join('')}
        <div class="status-line"><span class="status-dot ${Store.online ? 'on' : ''}"></span>${Store.online ? 'Mit Server verbunden' : 'Offline-Modus'}</div></div>`;
    $('#tabbar').innerHTML = NAV.map(n => item(n, 'tab')).join('');
  },

  renderTopbar() {
    const p = Pages[this.view];
    const bar = $('#topbar');
    bar.innerHTML = `<div><h1>${p.title()}</h1>${p.subtitle ? `<div class="sub">${p.subtitle()}</div>` : ''}</div>
      ${p.actions ? `<div class="topbar-actions">${p.actions()}</div>` : ''}`;
    p.onTopbar?.(bar);
  },

  /** Seite neu aufbauen – jede Seite bekommt ein frisches Element (keine alten Event-Listener) */
  render() {
    const p = Pages[this.view];
    this.renderNav();
    this.renderTopbar();
    const page = $('#page');
    const root = document.createElement('div');
    page.replaceChildren(root);
    page.style.animation = 'none'; void page.offsetWidth; page.style.animation = '';
    p.render(root, this.arg);
  },

  /** Aktuelle Seite aktualisieren, ohne Animation und Scroll-Sprung */
  refresh() {
    if (this.view === 'arcade' && Arcade.active) return this.renderNav();
    if (this.view === 'chat') { this.renderNav(); this.renderTopbar(); return; }
    const y = scrollY;
    this.renderNav();
    this.renderTopbar();
    const root = document.createElement('div');
    $('#page').replaceChildren(root);
    Pages[this.view].render(root, null);
    scrollTo(0, y);
  },

  async logout() {
    if (await UI.confirm(`Als ${ME.name} abmelden?`, { ok: 'Abmelden' })) Auth.logout();
  },

  go(hash) {
    const [view, arg] = (hash || 'home').split('/');
    const next = Pages[view] ? view : 'home';
    if (this.view === 'arcade' && next !== 'arcade') Arcade.stop();
    this.view = next;
    this.arg = arg || null;
    this.render();
    scrollTo(0, 0);
  },

  async start() {
    if (!Auth.restore()) await Auth.showLogin();
    await Store.init();
    await Data.load();
    Chat.start();

    document.addEventListener('click', e => {
      if (e.target.closest('[data-logout]')) return this.logout();
      if (e.target.closest('[data-theme-toggle]')) return Prefs.toggleTheme();
      const b = e.target.closest('[data-go]');
      if (!b) return;
      e.preventDefault();
      if (location.hash.slice(1) === b.dataset.go) this.go(b.dataset.go);
      else location.hash = b.dataset.go;
    });
    addEventListener('hashchange', () => this.go(location.hash.slice(1)));
    Bus.on('data', () => { if (this.view !== 'settings' || !Pages.settings.dirty) this.refresh(); });
    Bus.on('theme', () => { this.renderNav(); if (this.view === 'settings') Pages.settings.renderPanel(); });
    Bus.on('unread', n => { this.unread = n; this.renderNav(); document.title = (n ? `(${n}) ` : '') + 'Plyon'; });

    this.go(location.hash.slice(1));

    // Countdowns jede Sekunde, Seiteninhalt jede Minute aktualisieren
    let minute = new Date().getMinutes();
    setInterval(() => {
      UI.tick();
      const m = new Date().getMinutes();
      if (m !== minute) { minute = m; if (['home', 'blocks'].includes(this.view)) this.refresh(); }
    }, 1000);
  },
};

App.start();
